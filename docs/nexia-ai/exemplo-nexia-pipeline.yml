# Gerado pelo NEXIA AI (pipeline modelo, Fase 9). Deploy só por workflow_dispatch;
# produção exige revisores no environment "production" (Settings → Environments).
name: "NEXIA Pipeline"
run-name: "nexia-pipeline target=${{ inputs.target || 'none' }}"
on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      target:
        description: "Ambiente de deploy"
        type: "choice"
        options: ["none", "staging", "production"]
        default: "none"
permissions:
  contents: "read"
concurrency:
  group: "nexia-pipeline-${{ github.ref }}-${{ inputs.target || 'ci' }}"
  cancel-in-progress: false
jobs:
  ci:
    name: "CI"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
      - name: "Node"
        uses: "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020"
        with:
          node-version: "20"
          cache: "npm"
      - name: "Instalar dependências"
        run: "npm ci"
      - name: "Lint"
        run: "npm run lint"
      - name: "Testes"
        run: "npm test"
      - name: "Build"
        run: "npm run build"
      - name: "Dependências (vulnerabilidade alta ou crítica falha)"
        run: "npm audit --omit=dev --audit-level=high"
      - name: "Secret scan (gitleaks, checksum verificado)"
        run: |-
          curl -sSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks && rm gl.tgz
          ./gitleaks dir . --redact --no-banner
  deploy-staging:
    name: "Staging"
    needs: "ci"
    if: "github.event_name == 'workflow_dispatch' && (inputs.target == 'staging' || inputs.target == 'production')"
    runs-on: "ubuntu-latest"
    environment:
      name: "staging"
      url: "https://staging.alfa.com.br"
    concurrency:
      group: "deploy-staging"
      cancel-in-progress: false
    permissions:
      contents: "read"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
      - name: "Node"
        uses: "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020"
        with:
          node-version: "20"
          cache: "npm"
      - name: "Instalar dependências"
        run: "npm ci"
      - name: "Build"
        run: "npm run build"
      - name: "Deploy Cloudflare Pages (staging)"
        run: "npx -y wrangler@3 pages deploy \"dist\" --project-name \"${{ vars.CLOUDFLARE_PAGES_PROJECT }}\" --branch \"staging\""
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
      - name: "Smoke / health check"
        run: |-
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL$HEALTH_PATH" || true)
            if [ -n "$code" ] && [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then echo "ok $code"; exit 0; fi
            sleep 10
          done
          echo "health check falhou em $URL$HEALTH_PATH"; exit 1
        env:
          URL: "https://staging.alfa.com.br"
          HEALTH_PATH: "/"
  deploy-production:
    name: "Produção (aprovação no environment)"
    needs: "deploy-staging"
    if: "github.event_name == 'workflow_dispatch' && inputs.target == 'production'"
    runs-on: "ubuntu-latest"
    environment:
      name: "production"
      url: "https://alfa.com.br"
    concurrency:
      group: "deploy-production"
      cancel-in-progress: false
    permissions:
      contents: "read"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
      - name: "Node"
        uses: "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020"
        with:
          node-version: "20"
          cache: "npm"
      - name: "Instalar dependências"
        run: "npm ci"
      - name: "Build"
        run: "npm run build"
      - name: "Deploy Cloudflare Pages (production)"
        run: "npx -y wrangler@3 pages deploy \"dist\" --project-name \"${{ vars.CLOUDFLARE_PAGES_PROJECT }}\" --branch \"${{ vars.CLOUDFLARE_PRODUCTION_BRANCH }}\""
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
      - name: "Health check"
        run: |-
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL$HEALTH_PATH" || true)
            if [ -n "$code" ] && [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then echo "ok $code"; exit 0; fi
            sleep 10
          done
          echo "health check falhou em $URL$HEALTH_PATH"; exit 1
        env:
          URL: "https://alfa.com.br"
          HEALTH_PATH: "/"
