<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{titulo}}</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="topo"><h1>{{titulo}}</h1><p>{{nome}}</p></header>
  <main class="caixa">
    <form id="form" data-campos="{{campos}}" autocomplete="off">
      <div id="campos"></div>
      <input type="hidden" id="id">
      <div class="acoes">
        <button type="submit" id="salvar">Salvar</button>
        <button type="button" id="limpar" class="leve">Limpar</button>
      </div>
      <p id="aviso" role="status"></p>
    </form>
    <input id="busca" type="search" placeholder="Buscar..." aria-label="Buscar">
    <div class="tabela"><table><thead id="cab"></thead><tbody id="linhas"></tbody></table></div>
    <p id="vazio" class="leve">Nenhum registro ainda.</p>
  </main>
  <script src="crud.js"></script>
</body>
</html>
