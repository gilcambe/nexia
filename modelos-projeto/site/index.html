<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{titulo}}</title>
    <meta name="description" content="{{descricao}}" />
    <link rel="stylesheet" href="estilo.css" />
  </head>
  <body style="--cor-principal: {{cor}};">
    <header class="header">
      <div class="container">
        <h1 class="nome">{{nome}}</h1>
        <p class="titulo">{{titulo}}</p>
      </div>
    </header>
    <main class="main">
      <div class="container">
        <p class="descricao">{{descricao}}</p>
        <a href="https://wa.me/{{whatsapp}}" class="botao-whatsapp" target="_blank" rel="noopener">Fale no WhatsApp</a>
      </div>
    </main>
    <footer class="footer">
      <div class="container">
        <p>Feito com Kernex</p>
      </div>
    </footer>
  </body>
</html>
