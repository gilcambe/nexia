<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{titulo}}</title>
  <meta name="description" content="{{descricao}}">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="topo">
    <strong class="marca">{{nome}}</strong>
  </header>
  <main class="principal">
    <h1>{{titulo}}</h1>
    <p class="descricao">{{descricao}}</p>
    <a class="botao" href="https://wa.me/{{whatsapp}}" target="_blank" rel="noopener">Falar no WhatsApp</a>
  </main>
  <footer class="rodape">{{nome}}</footer>
</body>
</html>
