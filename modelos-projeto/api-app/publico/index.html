<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{titulo}}</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f7f9; color: #1d2330; }
    main { max-width: 640px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px 12px; border: 1px solid #dde1e7; border-radius: 8px; font: inherit; min-height: 44px; }
    button { padding: 10px 16px; border: 0; border-radius: 8px; background: #1d4ed8; color: #fff; font: inherit; min-height: 44px; cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
    li { background: #fff; border: 1px solid #dde1e7; border-radius: 8px; padding: 10px 12px; }
    #saude { font-size: .9rem; opacity: .75; }
  </style>
</head>
<body>
  <main>
    <h1>{{titulo}}</h1>
    <p id="saude">Conferindo a API…</p>
    <form id="form"><input id="texto" maxlength="500" placeholder="Escreva um item" aria-label="Novo item" required><button>Adicionar</button></form>
    <ul id="lista"></ul>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const listar = () => fetch('/itens').then((r) => r.json()).then((d) => {
      $('lista').innerHTML = '';
      (d.itens || []).slice().reverse().forEach((i) => { const li = document.createElement('li'); li.textContent = i.texto; $('lista').appendChild(li); });
    });
    fetch('/saude').then((r) => r.json()).then((d) => { $('saude').textContent = d.ok ? 'API no ar: ' + d.nome : 'API com problema'; })
      .catch(() => { $('saude').textContent = 'API fora do ar.'; });
    $('form').addEventListener('submit', (e) => {
      e.preventDefault();
      fetch('/itens', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ texto: $('texto').value }) })
        .then(() => { $('texto').value = ''; return listar(); });
    });
    listar().catch(() => {});
  </script>
</body>
</html>
