name: Turnstile CI Integration

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  test-turnstile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run Turnstile integration tests
        env:
          TURNSTILE_SITE_KEY: "${{ secrets.TURNSTILE_SITE_KEY }}"
          TURNSTILE_SECRET_KEY: "${{ secrets.TURNSTILE_SECRET_KEY }}"
        run: node --test tests/unit/turnstile.test.js
