    <!-- Nunca abrir em branco: se o app não aparecer, limpa só a cópia guardada do app (não o login nem os dados) e abre de novo.
         Se mesmo assim falhar, mostra um aviso com botão em vez da tela branca. Teste: tests/unit/body-coach-nunca-branco.test.js -->
    <script>
      (function () {
        var CH = 'bc_recuperou_em', ESPERA = 12000;
        function vivo() { var r = document.getElementById('root'); return !!(window.__bcVivo || (r && r.children.length)); }
        function aviso() {
          var r = document.getElementById('root'); if (!r || vivo()) return;
          r.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font-family:Inter,system-ui,sans-serif;background:#fbfbf7;color:#1f1d1a">' +
            '<div style="font-size:20px;font-weight:700">Body Coach</div><div style="font-size:15px;max-width:300px">O app n\u00e3o abriu direito. Confira a internet e toque abaixo.</div>' +
            '<button id="bc-abrir" style="padding:14px 22px;border:0;border-radius:14px;background:#cf6a3a;color:#fff;font-size:16px;font-weight:700">Abrir de novo</button></div>';
          document.getElementById('bc-abrir').onclick = function () { recuperar(true); };
        }
        function recuperar(forcar) {
          if (vivo() && !forcar) return;
          var ultima = 0; try { ultima = +localStorage.getItem(CH) || 0; } catch (e) {}
          if (!forcar && Date.now() - ultima < 120000) { aviso(); return; }
          try { localStorage.setItem(CH, String(Date.now())); } catch (e) {}
          var tarefas = [];
          try { if (navigator.serviceWorker) tarefas.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (g) { return g.unregister(); })); })); } catch (e) {}
          try { if (window.caches) tarefas.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
          var ir = function () { var u = new URL(location.href); u.searchParams.set('v', String(Date.now())); location.replace(u.href); };
          Promise.all(tarefas).then(ir, ir); setTimeout(ir, 3000);
        }
        window.__bcRecuperar = recuperar;
        // Arquivo do app que não carregou (versão velha, rede caiu no meio): recupera na hora.
        window.addEventListener('error', function (e) {
          var t = e && e.target; var src = t && (t.src || t.href) || '';
          if (/\/assets\//.test(src)) recuperar(false);
        }, true);
        setTimeout(function () { if (!vivo()) recuperar(false); }, ESPERA);
      })();
    </script>

  <body>
