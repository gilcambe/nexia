# NEXIA — deploy no Cloudflare Worker, plano GRÁTIS (ADR-FREE-01). Nada pago: sem Container.
# Só manual (botão "Run workflow"). Nunca roda em push. Exige o segredo CLOUDFLARE_API_TOKEN
# e a variável CLOUDFLARE_ACCOUNT_ID no environment "production" do GitHub (configure
# "Required reviewers" nele para exigir aprovação de uma pessoa). Os segredos do app ficam nos
# segredos do repositório e são copiados para o Worker a cada deploy (ADR-FREE-02).
name: Deploy Cloudflare

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite DEPLOY para confirmar o deploy em produção'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker (grátis)
    if: github.event.inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Testes antes do deploy
        run: npm test
      - name: Deploy
        run: npx -y wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Segredos do Worker (copiados dos segredos do repositório; só os nomes aparecem no log)
        run: |
          node scripts/worker-secrets.js "$RUNNER_TEMP/worker-secrets.json"
          if [ "$(cat "$RUNNER_TEMP/worker-secrets.json")" != "{}" ]; then npx -y wrangler@4 secret bulk "$RUNNER_TEMP/worker-secrets.json"; fi
          rm -f "$RUNNER_TEMP/worker-secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NEXIA_SECRETS_JSON: ${{ toJSON(secrets) }}
