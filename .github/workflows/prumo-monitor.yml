# NEXIA — monitoramento do Kernex Finance (Prumo)
# A cada hora e por acionamento manual (workflow_dispatch).
# Se 2 checagens seguidas falharem, abre issue de alerta; ao restabelecer, fecha a issue.
name: Monitoramento Prumo

on:
  schedule:
    - cron: '7 * * * *'  # 13/11: era */30 (so o dono usa o Finance); fila do Actions cheia
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: prumo-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Conferir Kernex Finance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Monitorar Prumo
        run: node .github/scripts/prumo-monitor.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
