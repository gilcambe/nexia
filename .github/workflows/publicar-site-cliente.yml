name: Publicar site de cliente (Cloudflare Pages)
# Cada cliente fica em https://<slug>.pages.dev (grátis, sem "gcbezerra" no endereço).
# Uso: Actions > Publicar site de cliente > Run workflow, com o slug e a pasta dos arquivos estáticos (ex.: sites/<slug>).
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Nome do site (letras minúsculas, números e hífen; 3 a 40)'
        required: true
      pasta:
        description: 'Pasta com os arquivos estáticos do site (ex.: sites/<slug>)'
        required: true
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validar slug e pasta
        env:
          SLUG: ${{ inputs.slug }}
          PASTA: ${{ inputs.pasta }}
        run: |
          echo "$SLUG" | grep -Eq '^[a-z0-9-]{3,40}$' || { echo "::error::slug inválido (use ^[a-z0-9-]{3,40}$)"; exit 1; }
          case "$PASTA" in /*|*..*) echo "::error::pasta inválida"; exit 1;; esac
          [ -d "$PASTA" ] || { echo "::error::pasta não encontrada: $PASTA"; exit 1; }
      - name: Criar o projeto no Cloudflare Pages (se ainda não existir)
        env:
          SLUG: ${{ inputs.slug }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@3 pages project create "$SLUG" --production-branch main || true
      - name: Publicar
        env:
          SLUG: ${{ inputs.slug }}
          PASTA: ${{ inputs.pasta }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@3 pages deploy "$PASTA" --project-name "$SLUG" --branch main
      - name: Avisar
        env:
          SLUG: ${{ inputs.slug }}
        run: echo "::notice::Site publicado em https://${SLUG}.pages.dev"
