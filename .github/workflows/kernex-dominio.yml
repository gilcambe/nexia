# Liga um subdomínio Kernex ao Worker e libera no login do Firebase (só adiciona; nunca remove nada).
name: Kernex - ligar domínio
on:
  workflow_dispatch:
    inputs:
      dominio:
        description: 'Subdomínio (ex.: finance.kernex.com.br)'
        required: true
        default: finance.kernex.com.br
permissions:
  contents: read
jobs:
  ligar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Token do Cloudflare fica no environment "production" (igual ao deploy-cloudflare.yml).
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Ligar no Cloudflare (Custom Domain do Worker)
        run: node scripts/cloudflare-dominio.js "${{ inputs.dominio }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Liberar no login do Firebase
        if: always()
        run: node scripts/firebase-dominio.js "${{ inputs.dominio }}"
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
