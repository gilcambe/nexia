# NEXIA — publica as regras do Firestore (firestore.rules). Manual.
# "conferir" só mostra os masters; "PUBLICAR" publica, e só se a conta do dono (MASTER_EMAIL) já for master.
# "BODYCOACH" só acrescenta às regras no ar o bloco do Body Coach (dados de cada aluno); o resto fica igual.
# Autorizado pelo dono em 2026-10-06 ("pode publicar as regras").
name: Publicar regras do Firestore

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite PUBLICAR para publicar as regras (BODYCOACH só para o Body Coach; conferir para só olhar os masters)'
        required: true
        default: 'conferir'

permissions:
  contents: read

jobs:
  regras:
    name: Regras do Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Conferir ou publicar
        run: node scripts/publicar-regras.js ${{ inputs.confirm == 'PUBLICAR' && ' ' || (inputs.confirm == 'BODYCOACH' && '--body-coach' || '--dry-run') }}
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          MASTER_EMAIL: ${{ secrets.MASTER_EMAIL }}
