# NEXIA — Robô de ofertas com link de afiliado (ADR-AFI-01). Grátis: GitHub Actions + Cloudflare Pages.
# A cada 2 horas: busca ofertas na Shopee (API oficial de afiliados), junta com os produtos colados à mão,
# gera o site https://<slug>.pages.dev e posta nas redes ligadas (só nas contas do dono, com limite por dia).
# Pelo celular: Actions > "Robô de ofertas" > Run workflow, e escolha a ação (adicionar link, remover, etc.).
# O estado fica na branch "afiliados-dados". Os logs são públicos: o robô nunca escreve segredo nem ganho.
name: Robô de ofertas

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      acao:
        description: 'O que fazer'
        type: choice
        options: [rodar, adicionar, remover, diagnostico, so-site]
        default: rodar
      link:
        description: 'Link do produto (para adicionar ou remover)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: afiliados
  cancel-in-progress: false

jobs:
  robo:
    name: Robô de ofertas
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Abrir os dados do robô
        run: |
          git config user.name "NEXIA Ofertas"
          git config user.email "ofertas@nexia.invalid"
          if git fetch -q --depth 1 origin afiliados-dados; then
            git worktree add -q -B afiliados-dados dados FETCH_HEAD
          else
            git worktree add -q --orphan -b afiliados-dados dados
          fi
      - name: Robô
        env:
          ACAO: ${{ github.event_name == 'schedule' && 'rodar' || inputs.acao }}
          LINK: ${{ inputs.link }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
        run: |
          set -euo pipefail
          case "$ACAO" in
            rodar)       node afiliados/robo.js rodar --dados dados --saida "$RUNNER_TEMP/site" ;;
            so-site)     node afiliados/robo.js rodar --dados dados --saida "$RUNNER_TEMP/site" --divulgar nao ;;
            adicionar)   node afiliados/robo.js adicionar "$LINK" --dados dados
                         node afiliados/robo.js rodar --dados dados --saida "$RUNNER_TEMP/site" --divulgar nao ;;
            remover)     node afiliados/robo.js remover "$LINK" --dados dados
                         node afiliados/robo.js rodar --dados dados --saida "$RUNNER_TEMP/site" --divulgar nao ;;
            diagnostico) node afiliados/robo.js diagnostico ;;
            *) echo "::error::ação desconhecida"; exit 1 ;;
          esac
      - name: Guardar os dados do robô
        if: always()
        run: |
          cd dados
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "dados do robô de ofertas"
          git push -q origin afiliados-dados
      - name: Publicar o site
        if: github.event_name == 'schedule' || inputs.acao != 'diagnostico'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Site sem nenhuma oferta (ainda sem chaves e sem links colados) não vai ao ar.
          [ -d "$RUNNER_TEMP/site/p" ] || { echo "::notice::Ainda sem ofertas; o site não foi publicado."; exit 0; }
          SLUG=$(node -p "require('./afiliados/config.json').site.slug")
          echo "$SLUG" | grep -Eq '^[a-z0-9-]{3,40}$' || { echo "::error::slug inválido"; exit 1; }
          npx -y wrangler@3 pages project create "$SLUG" --production-branch main >/dev/null 2>&1 || true
          npx -y wrangler@3 pages deploy "$RUNNER_TEMP/site" --project-name "$SLUG" --branch main
          echo "::notice::Site de ofertas: https://${SLUG}.pages.dev"
