# NEXIA — publica os índices do Firestore (só cria os que faltam; nunca apaga). Manual.
# "conferir" só lista o que falta; "PUBLICAR" cria.
name: Publicar índices do Firestore

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite PUBLICAR para criar os índices que faltam (ou conferir para só listar)'
        required: true
        default: 'conferir'

permissions:
  contents: read

jobs:
  indices:
    name: Índices do Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Conferir ou publicar
        run: node scripts/publicar-indices.js ${{ inputs.confirm == 'PUBLICAR' && ' ' || '--dry-run' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          FIREBASE_SERVICE_ACCOUNT_B: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B }}
          FIREBASE_SERVICE_ACCOUNT_C: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_C }}
