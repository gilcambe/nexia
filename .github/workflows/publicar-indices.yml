# NEXIA — publica os índices do Firestore (só cria os que faltam; nunca apaga). Manual.
# "conferir" só lista o que falta; "PUBLICAR" cria.
name: Publicar índices do Firestore

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'PUBLICAR = cria os índices que faltam em todos; COFRE = só nos bancos extras do Vault (B..H); conferir = só lista'
        required: true
        default: 'conferir'

permissions:
  contents: read

jobs:
  indices:
    name: Índices do Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Conferir ou publicar
        run: node scripts/publicar-indices.js ${{ inputs.confirm == 'PUBLICAR' && ' ' || inputs.confirm == 'COFRE' && '--so-cofre' || '--dry-run' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          FIREBASE_SERVICE_ACCOUNT_B: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B }}
          FIREBASE_SERVICE_ACCOUNT_C: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_C }}
          FIREBASE_SERVICE_ACCOUNT_D: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_D }}
          FIREBASE_SERVICE_ACCOUNT_E: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_E }}
          FIREBASE_SERVICE_ACCOUNT_F: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_F }}
          FIREBASE_SERVICE_ACCOUNT_G: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_G }}
          FIREBASE_SERVICE_ACCOUNT_H: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_H }}
