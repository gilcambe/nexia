# Cortex — executor de CONTRATO (11/11/2026): uma IA grátis + teste de aceitação decide. Substitui os 7 agentes
# para tarefas com "Arquivos:" e "Teste:". Sem Firebase e sem produção: só repositório, IAs grátis e teste.
# Dispara: rótulo "cortex-contrato" na issue, ou manual (número da issue).
name: Cortex Contrato

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      numero:
        description: Número da issue com o contrato
        required: true
      degraus:
        description: 'Quantas IAs grátis tentar antes do Claude Pro (vazio = 6; 0 = só o Claude, para teste)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: cortex-contrato-${{ inputs.numero || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  contrato:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'cortex-contrato'
    name: Contrato #${{ inputs.numero || github.event.issue.number }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75   # o degrau do PC2 (CPU) pode levar até 12 min por tentativa
    env:
      NUMERO: ${{ inputs.numero || github.event.issue.number }}
      CONTRATO_DEGRAUS: ${{ inputs.degraus }}
      GH_TOKEN: ${{ secrets.NEXIA_JOBS_TOKEN || secrets.GITHUB_TOKEN }}
      GITHUB_MODELS_TOKEN: ${{ github.token }}
      GITHUB_TOKEN_ACAO: ${{ github.token }}
      # Último degrau: plano Claude Pro do dono (claude setup-token). Teto diário em vars.CONTRATO_CLAUDE_DIA (padrão 5).
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CONTRATO_CLAUDE_DIA: ${{ vars.CONTRATO_CLAUDE_DIA }}
      CONTRATO_CLAUDE_PRO: ${{ vars.CONTRATO_CLAUDE_PRO }}
      # Degrau grátis do PC2 (fila maquinas no D1; o PC busca a tarefa). Desliga com vars.CONTRATO_PC=0.
      NEXIA_MAQUINA_TOKEN: ${{ secrets.NEXIA_MAQUINA_TOKEN }}
      NEXIA_D1_TOKEN: ${{ secrets.NEXIA_D1_TOKEN }}
      NEXIA_D1_ACCOUNT_ID: ${{ secrets.NEXIA_D1_ACCOUNT_ID }}
      CONTRATO_PC: ${{ vars.CONTRATO_PC }}
      GITHUB_APP_ID: ${{ secrets.NEXIA_GITHUB_APP_ID }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.NEXIA_GITHUB_APP_PRIVATE_KEY }}
      IA_VAGAS_CONFIG: ${{ vars.IA_VAGAS_CONFIG }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      CODESTRAL_API_KEY: ${{ secrets.CODESTRAL_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
      CLOUDFLARE_AI_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_AI_ACCOUNT_ID }}
      NEXIA_MODELS_CODING: ${{ secrets.NEXIA_MODELS_CODING }}
      NEXIA_MODELS_REASONING: ${{ secrets.NEXIA_MODELS_REASONING }}
      IA_VAGA_1: ${{ secrets.IA_VAGA_1 }}
      IA_VAGA_2: ${{ secrets.IA_VAGA_2 }}
      IA_VAGA_3: ${{ secrets.IA_VAGA_3 }}
      IA_VAGA_4: ${{ secrets.IA_VAGA_4 }}
      IA_VAGA_5: ${{ secrets.IA_VAGA_5 }}
      IA_VAGA_6: ${{ secrets.IA_VAGA_6 }}
      IA_VAGA_7: ${{ secrets.IA_VAGA_7 }}
      IA_VAGA_8: ${{ secrets.IA_VAGA_8 }}
      IA_VAGA_9: ${{ secrets.IA_VAGA_9 }}
      IA_VAGA_10: ${{ secrets.IA_VAGA_10 }}
      IA_VAGA_11: ${{ secrets.IA_VAGA_11 }}
      IA_VAGA_12: ${{ secrets.IA_VAGA_12 }}
      IA_VAGA_13: ${{ secrets.IA_VAGA_13 }}
      IA_VAGA_14: ${{ secrets.IA_VAGA_14 }}
      IA_VAGA_15: ${{ secrets.IA_VAGA_15 }}
      IA_VAGA_16: ${{ secrets.IA_VAGA_16 }}
      IA_VAGA_17: ${{ secrets.IA_VAGA_17 }}
      IA_VAGA_18: ${{ secrets.IA_VAGA_18 }}
      IA_VAGA_19: ${{ secrets.IA_VAGA_19 }}
      IA_VAGA_20: ${{ secrets.IA_VAGA_20 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: develop
          token: ${{ secrets.NEXIA_JOBS_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Claude Code (só se o plano Pro estiver ligado)
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code@2.1.312
      - name: Executar o contrato
        run: node scripts/cortex-contrato.js
