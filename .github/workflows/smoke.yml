# NEXIA — conferência do site no ar (só leitura, só curl; nunca Playwright contra produção).
# Manual ou agendado (a cada hora). Não usa segredo nenhum.
name: Smoke (site no ar)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'Endereço do NEXIA (ex.: https://nexia.<conta>.workers.dev)'
        required: false
        default: 'https://nexia.gcbezerra.workers.dev'

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    name: Conferir site e API
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Verificar idade da última execução
        id: idade
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node scripts/central.js
      - name: Conferir
        if: steps.idade.outputs.pulado != 'true'
        env:
          BASE: ${{ inputs.url || 'https://nexia.gcbezerra.workers.dev' }}
        run: |
          set -u
          BASE="${BASE:-https://nexia.gcbezerra.workers.dev}"
          case "$BASE" in https://*) ;; *) echo "use https://"; exit 2;; esac
          BASE="${BASE%/}"
          fail=0
          check() { # caminho, códigos aceitos, método
            code=$(curl -s -o /tmp/body -w '%{http_code}' -X "${3:-GET}" "$BASE$1" || echo 000)
            if echo " $2 " | grep -q " $code "; then r=OK; else r=FALHOU; fail=1; fi
            echo "$r $code ${3:-GET} $1 $(head -c 160 /tmp/body | tr -d '\n')"
          }
          check /health 200
          for p in / /projetos /execucoes /aprovacoes /auditoria /cortex-app /login /ces/landing; do check "$p" 200; done
          # Body Coach (app instalável): página, manifesto, service worker e ícone.
          for p in /body-coach/ /body-coach/manifest.webmanifest /body-coach/sw.js /body-coach/icon.svg; do check "$p" 200; done
          check /api/firebase-config "200 503"
          for p in /api/nexia/me /api/nexia/projects /api/nexia/executions /api/nexia/metrics; do check "$p" 401; done
          check /api/cortex 401 POST
          check /.env "400 404"
          check /server.js 404
          check /package.json 404
          check / 405 POST
          exit $fail
