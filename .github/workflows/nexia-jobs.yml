# NEXIA — fila de tarefas longas (ADR-FREE-02). O Worker grátis do Cloudflare não roda processos
# longos; ele dispara este workflow com um pedido que leva só ids (nunca segredo nem conteúdo).
# Roda o mesmo código da API em Node: execuções de agentes, onboarding e retomada.
# Repositório público: minutos do Actions grátis. Os logs são públicos, por isso o script só
# imprime um resumo curto.
name: NEXIA Jobs

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'Tarefa (JSON só com ids), enviada pelo Worker'
        required: true

permissions:
  contents: read
  models: read   # ADR-FREE-04: GitHub Models grátis com o próprio token do Actions

jobs:
  run:
    name: Tarefa NEXIA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - name: Rodar a tarefa
        run: node scripts/nexia-job.js
        env:
          NODE_ENV: production
          NEXIA_JOB: ${{ inputs.job }}
          # Segredos do repositório, um por nome (lista do .env.example; o teste CF10 confere).
          # O GitHub não aceita segredo começando com GITHUB_: esses ficam como NEXIA_GITHUB_*.
          # TEMPORÁRIO: segredos por cliente (NEXIA_<FIREBASE|CLOUDFLARE>_<TENANT>_*, Fase 9) precisam
          # de uma linha aqui. Motivo: passando todos os segredos de uma vez, o GitHub parou os runs em "action_required" (2026-10-04).
          NEXIA_APP_URL: ${{ secrets.NEXIA_APP_URL }}
          NEXIA_CNAME_TARGET: ${{ secrets.NEXIA_CNAME_TARGET }}
          NEXIA_CRON_SECRET: ${{ secrets.NEXIA_CRON_SECRET }}
          NEXIA_GITHUB_TOKEN: ${{ secrets.NEXIA_GITHUB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          MASTER_EMAIL: ${{ secrets.MASTER_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_AI_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_AI_ACCOUNT_ID }}
          NEXIA_MODELS_CODING: ${{ secrets.NEXIA_MODELS_CODING }}
          NEXIA_MODELS_REASONING: ${{ secrets.NEXIA_MODELS_REASONING }}
          NEXIA_MODELS_FAST: ${{ secrets.NEXIA_MODELS_FAST }}
          METRICS_SECRET: ${{ secrets.METRICS_SECRET }}
          DUNNING_SECRET: ${{ secrets.DUNNING_SECRET }}
          GITHUB_REPO: ${{ secrets.NEXIA_GITHUB_REPO }}
          GITHUB_APP_ID: ${{ secrets.NEXIA_GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.NEXIA_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets.NEXIA_GITHUB_APP_INSTALLATION_ID }}
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          MP_WEBHOOK_SECRET: ${{ secrets.MP_WEBHOOK_SECRET }}
          SENTINEL_HEAL_ENABLED: ${{ secrets.SENTINEL_HEAL_ENABLED }}
          NEXIA_DEFAULT_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_MODELS_TOKEN: ${{ github.token }}
