# Varredura de segredos (#816, parte 2 #874). Grátis: só a CLI do gitleaks (licença MIT), sem a gitleaks-action paga.
# Olha só os commits do PR (base..head), para não travar o CI por coisas antigas do histórico.
name: Gitleaks

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar gitleaks (CLI grátis, versão e checksum fixos)
        env:
          VERSAO: 8.21.2
          SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -sSLf -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
      - name: Procurar segredos nos commits do PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./gitleaks git --no-banner --redact --verbose --exit-code 1 --log-opts="${BASE}..${HEAD}" .
