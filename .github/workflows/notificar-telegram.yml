# NEXIA — avisos no Telegram do dono (grátis). Sem os segredos TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID não faz nada.
# Avisa quando um PR entra na develop e, à mão, serve de teste da conexão.
name: Avisar no Telegram

on:
  pull_request:
    types: [closed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      mensagem:
        description: 'Texto do aviso de teste'
        required: false
        default: 'Teste: o NEXIA está conectado ao seu Telegram.'

permissions:
  contents: read

jobs:
  avisar:
    name: Avisar
    # PR de outro repositório não recebe segredos; só avisa PR mesclado deste repositório.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Enviar aviso
        run: node scripts/notificar-telegram.js
        env:
          MENSAGEM: ${{ github.event_name == 'workflow_dispatch' && inputs.mensagem || format('Entrou na develop: PR {0} - {1}', github.event.pull_request.number, github.event.pull_request.title) }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
