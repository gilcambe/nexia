name: Prumo - teste ao vivo da leitura de print
on:
  workflow_dispatch:
  push:
    branches: ['nexia/prumo-*']
    paths: ['netlify/functions/prumo.js', 'netlify/functions/prumo-lib/documentos.js', 'scripts/kf-bateria-prints.js', 'scripts/kf-bateria-ao-vivo.js', 'tests/fixtures/kf-prints/**', 'scripts/prumo-ler-print-ao-vivo.js', 'scripts/fortune-api-ao-vivo.js', '.github/workflows/prumo-print-ao-vivo.yml']
permissions:
  contents: read
jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Ler o print de exemplo com as IAs grátis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/prumo-ler-print-ao-vivo.js
      - name: Bateria com 8 tipos de print (extrato, fatura, Pix, cupom, conta, previdência, corretora, banco)
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true  # aqui só há as chaves do GitHub (sem Workers AI); quem decide é a bateria NO AR
        run: node scripts/kf-bateria-prints.js
      - name: Medir a API no ar (usuário de teste)
        if: always()
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: node scripts/fortune-api-ao-vivo.js
      - name: Bateria NO AR (API publicada, prints falsos e robôs de consultoria)
        if: always()
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: node scripts/kf-bateria-ao-vivo.js
