name: Android Body Coach (Google Play)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/body-coach/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Chave de envio
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::Falta o segredo ANDROID_KEYSTORE_B64. Rode o arquivo android-play.bat no Windows."; exit 1; fi
          echo "$KS_B64" | base64 -d > upload.keystore
      - name: Versao
        run: |
          jq --argjson c "${{ github.run_number }}" '.appVersionCode = $c | .appVersionName = ("1.0." + ($c|tostring))' twa-manifest.json > t.json && mv t.json twa-manifest.json
      - name: Configurar Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_SDK_ROOT\"}" > ~/.bubblewrap/config.json
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Gerar AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          npx -y @bubblewrap/cli@1.27.0 update --skipVersionUpgrade --manifest=./twa-manifest.json
          npx -y @bubblewrap/cli@1.27.0 build --skipPwaValidation --manifest=./twa-manifest.json
          ls -la *.aab *.apk
      - name: Digital da chave (para o assetlinks.json)
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          FP=$(keytool -list -v -keystore upload.keystore -alias upload -storepass "$KS_PASS" | grep 'SHA256:' | awk '{print $2}')
          echo "SHA256 da chave de envio: $FP"
          echo "### SHA256 da chave de envio: \`$FP\`" >> "$GITHUB_STEP_SUMMARY"
          rm -f upload.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: body-coach-play
          path: |
            apps/body-coach/android/app-release-bundle.aab
            apps/body-coach/android/app-release-signed.apk
          retention-days: 30
