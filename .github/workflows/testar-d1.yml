name: Testar banco de reserva (Cloudflare D1)
# Cria o banco D1 "nexia-cortex" se não existir e testa gravar/ler/consultar/transação/Vault nele.
# Usa o token próprio NEXIA_D1_TOKEN (só D1 Edit) e NEXIA_D1_ACCOUNT_ID.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - run: node scripts/diag-d1.js
        env:
          NEXIA_D1_TOKEN: ${{ secrets.NEXIA_D1_TOKEN }}
          NEXIA_D1_ACCOUNT_ID: ${{ secrets.NEXIA_D1_ACCOUNT_ID }}
