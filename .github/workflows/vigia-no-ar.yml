# NEXIA — Vigia no Ar: monitora periodicamente a saúde dos sites em produção.
# A cada 15 minutos executa scripts/vigia-no-ar.js para verificar os sites do catálogo NO_AR.
# Em caso de falhas consecutivas, aciona rollback automático e abre/gerencia issues de alerta.
name: Vigia no Ar

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vigia-no-ar
  cancel-in-progress: false

jobs:
  vigia:
    name: Monitorar sites no ar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Executar Vigia no Ar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/vigia-no-ar.js
