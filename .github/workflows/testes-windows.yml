# Objetivo: a suíte de testes passa também no Windows (PCs da equipe rodam Windows 11). Issue #3557.
name: Testes no Windows
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: testes-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  testes-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Testes (os mesmos do Linux)
        # npm test usa scripts/testes-unit.js (lista os arquivos sem depender do glob do shell).
        run: npm test
