name: Sondar sites de leilão (temporário)
on:
  push:
    branches: [nexia/bezsan-agregadores]
    paths: ['.github/workflows/sondar-agregadores.yml']
permissions:
  contents: write
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - name: Sondar
        run: |
          set +e
          mkdir -p /tmp/s && cd /tmp/s
          M=https://www.leiloesjudiciais.com.br/api/mcp/messages
          p() { echo "===== $1" >> saida.txt; curl -sS -m 40 -X POST "$M" -H 'Content-Type: application/json' -A "NexiaBezsan/1.0" -d "$2" -w "\nHTTP %{http_code}\n" > r.txt 2>&1; head -c ${3:-3000} r.txt >> saida.txt; echo >> saida.txt; }
          p detalhe '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"get_leilao_details","arguments":{"leilaoId":"218898"}}}' 2500
          p detalhe2 '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"get_leilao_details","arguments":{"leilaoId":"99916"}}}' 2500
          p vazio '{"jsonrpc":"2.0","id":6,"method":"tools/call","params":{"name":"search_leiloes","arguments":{"query":"","estado":"SP","categoria":"imoveis"}}}' 600
          p imovel '{"jsonrpc":"2.0","id":6,"method":"tools/call","params":{"name":"search_leiloes","arguments":{"query":"imovel","categoria":"imoveis"}}}' 400
          grep -o 'totalResults[^,]*' r.txt >> saida.txt
          echo "===== links" >> saida.txt
          curl -sS -m 30 https://www.leiloesjudiciais.com.br/imoveis | grep -oE 'href="/[a-z-]+/[^"]{3,120}"' | sort -u | head -30 >> saida.txt
          echo "===== cors s3" >> saida.txt
          curl -sS -m 30 -I -H 'Origin: https://bezsan.pages.dev' https://s3-sa-east-1.amazonaws.com/906de634c48fb7d34136160b4c353ae4/public/anexo/4399341790094440.pdf | head -15 >> saida.txt
          echo "===== cors mcp" >> saida.txt
          curl -sS -m 20 -i -X OPTIONS "$M" -H 'Origin: https://bezsan.pages.dev' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' | head -15 >> saida.txt
          true
      - name: Guardar saída
        if: always()
        run: |
          cd /tmp/s && git init -q && git add saida.txt && git -c user.name=nexia -c user.email=nexia@users.noreply.github.com commit -qm sonda
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/sondas-agreg-${{ github.run_id }}
