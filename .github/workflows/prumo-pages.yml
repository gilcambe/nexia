name: Prumo no Pages (endereço Kernex)
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths: ['apps/prumo/pages-proxy/**', '.github/workflows/prumo-pages.yml', 'scripts/firebase-dominio.js']
permissions:
  contents: read
jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Publicar kernex-prumo.pages.dev
        id: publicar
        working-directory: apps/prumo/pages-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler@3 pages project create kernex-prumo --production-branch main >/dev/null 2>&1 || true
          npx -y wrangler@3 pages deploy public --project-name kernex-prumo --branch main
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/kernex-prumo" | jq -r '.result.subdomain')
          echo "sub=$SUB" >> "$GITHUB_OUTPUT"
          echo "### Link do Prumo: https://$SUB/prumo/" >> "$GITHUB_STEP_SUMMARY"
      - name: Liberar os endereços no login do Google (Firebase)
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: node scripts/firebase-dominio.js "${{ steps.publicar.outputs.sub }}" nexia.gcbezerra.workers.dev
      - name: Conferir se abre
        run: |
          for i in 1 2 3 4 5 6; do
            C=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ steps.publicar.outputs.sub }}/prumo/")
            echo "tentativa $i: $C"; [ "$C" = "200" ] && exit 0; sleep 10
          done
          exit 1
