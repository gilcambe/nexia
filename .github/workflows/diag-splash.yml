name: Diagnóstico Splash no ar (temporário)
on:
  push:
    branches: [claude/splash-diagnostico]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node scripts/diag-splash-no-ar.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prints
          path: diag-*.png
