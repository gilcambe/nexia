name: Novo site de cliente (modelo + publicar)
# Modelo reutilizável: o site do cliente é um arquivo clientes/<slug>/site.json (copie clientes/exemplo/site.json e edite).
# Este workflow gera o site com o NEXIA Site Kit e publica em https://<slug>.pages.dev (Cloudflare Pages, grátis).
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Nome do site (letras minúsculas, números e hífen; 3 a 40). Usa clientes/<slug>/site.json'
        required: true
      pasta:
        description: 'Opcional: pasta em clientes/ quando difere do nome do site (ex.: adriano para adrianoblumer). Vazio = o próprio nome'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Validar o nome
        env:
          SLUG: ${{ inputs.slug }}
          PASTA: ${{ inputs.pasta }}
        run: |
          echo "$SLUG" | grep -Eq '^[a-z0-9-]{3,40}$' || { echo "::error::slug inválido (use ^[a-z0-9-]{3,40}$)"; exit 1; }
          PASTA="${PASTA:-$SLUG}"
          echo "$PASTA" | grep -Eq '^[a-z0-9-]{3,40}$' || { echo "::error::pasta inválida (use ^[a-z0-9-]{3,40}$)"; exit 1; }
          [ -f "clientes/$PASTA/site.json" ] || { echo "::error::falta clientes/$PASTA/site.json"; exit 1; }
          echo "PASTA=$PASTA" >> "$GITHUB_ENV"
      - name: Gerar o site
        run: node scripts/renderizar-site.js "clientes/$PASTA/site.json" "$RUNNER_TEMP/site" "clientes/$PASTA/midia.json"
      - name: Criar o projeto no Cloudflare Pages (se ainda não existir)
        env:
          SLUG: ${{ inputs.slug }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@3 pages project create "$SLUG" --production-branch main || true
      - name: Publicar
        env:
          SLUG: ${{ inputs.slug }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@3 pages deploy "$RUNNER_TEMP/site" --project-name "$SLUG" --branch main
      - name: Avisar
        env:
          SLUG: ${{ inputs.slug }}
        run: echo "::notice::Site publicado em https://${SLUG}.pages.dev"
