# NEXIA — Prova de Qualidade Q8 do Cortex (#1636)
# Workflow manual para rodar as 30 perguntas de pequenos negócios e postar relatório como comentário em issue.
name: Prova de Qualidade do Cortex

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Número da Issue para publicar o relatório (padrão: 1636)'
        required: false
        default: '1636'

permissions:
  contents: read
  issues: write

jobs:
  qualidade:
    name: Avaliar 30 perguntas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Instalar dependências
        run: npm ci
      - name: Executar prova de qualidade
        run: node scripts/cortex-qualidade.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number || '1636' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
