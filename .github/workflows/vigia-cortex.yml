# NEXIA — vigia do Cortex. De 3 em 3 horas confere se a fila anda; se parou, abre um alerta para o dono (e-mail do GitHub).
name: Vigia do Cortex

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  vigia:
    name: Conferir a fila
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Conferir
        run: node scripts/vigia-cortex.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
