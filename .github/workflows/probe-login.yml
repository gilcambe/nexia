name: probe-login
on:
  push:
    branches: [nexia/probe-login-google]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          F=https://nexia-c8710.firebaseapp.com
          for js in iframe.js handler.js; do curl -sS "$F/__/auth/$js" -o /tmp/$js; done
          python3 - <<'PY'
          s=open('/tmp/handler.js').read()
          i=s.index('webwidgetstarter_projectNumber'); print(s[i-2600:i+100])
          import re
          for m in re.finditer(r'[,;\s]up=function', s): print('UP', s[m.start():m.start()+400])
          for m in re.finditer(r'[,;\s]ph=function', s): print('PH', s[m.start():m.start()+300])
          PY
          curl -sS https://nexia-c8710.firebaseapp.com/__/auth/experiments.js | head -c 1500
