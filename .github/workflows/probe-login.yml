name: probe-login
on:
  push:
    branches: [nexia/probe-login-google]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cd /tmp && npm i -s playwright@1.47.2 >/dev/null 2>&1 && npx -y playwright@1.47.2 install chromium >/dev/null 2>&1
          cat > t.js <<'JS'
          const { chromium, devices } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({ ...devices['Pixel 7'] });
            const p = await ctx.newPage();
            p.on('console', m => console.log('CONSOLE', m.type(), m.text().slice(0, 300)));
            ctx.on('page', np => { console.log('POPUP', np.url()); np.on('framenavigated', f => f === np.mainFrame() && console.log('POPUP-NAV', f.url().slice(0, 400))); });
            p.on('framenavigated', f => console.log('NAV', f.url().slice(0, 300)));
            await p.goto('https://nexiabodycoach.pages.dev/body-coach/', { waitUntil: 'networkidle' });
            await p.waitForTimeout(3000);
            console.log('URL', p.url());
            const btn = p.getByText('Entrar com Google').first();
            if (!(await btn.count())) { await p.goto('https://nexiabodycoach.pages.dev/body-coach/auth', { waitUntil: 'networkidle' }); await p.waitForTimeout(2000); }
            console.log('URL2', p.url());
            await p.getByText('Entrar com Google').first().click();
            await p.waitForTimeout(12000);
            const txt = await p.locator('body').innerText();
            console.log('TEXT', txt.replace(/\s+/g, ' ').slice(0, 800));
            await b.close();
          })().catch(e => { console.log('ERR', e.message); process.exit(0); });
          JS
          node t.js
