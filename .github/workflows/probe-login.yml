name: probe-login
on:
  push:
    branches: [nexia/probe-login-google]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          P=https://nexiabodycoach.pages.dev; F=https://nexia-c8710.firebaseapp.com
          echo "== CONFIG"; curl -sS $P/api/firebase-config | sed 's/"apiKey":"[^"]*"/"apiKey":"x"/'; echo
          echo "== CONFIG-W"; curl -sS https://nexia.gcbezerra.workers.dev/api/firebase-config | sed 's/"apiKey":"\([^"]\{8\}\)[^"]*"/"apiKey":"\1"/'; echo
          curl -sS $P/body-coach/ -o /tmp/i; echo "== REFPOL"; curl -sSI $P/body-coach/ | grep -i "referrer\|content-security\|cross-origin"
          for js in iframe.js handler.js; do
            curl -sS "$F/__/auth/$js" -o /tmp/$js
            echo "== $js"; grep -o ".\{250\}[^a-zA-Z]Pl([^)]*).\{250\}" /tmp/$js | head -8
            grep -o ".\{250\}getAuthorizedDomains\|authorizedDomains.\{250\}" /tmp/$js | head -5
          done
