name: probe-login
on:
  push:
    branches: [nexia/probe-login-google]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          F=https://nexia-c8710.firebaseapp.com
          for js in iframe.js handler.js; do curl -sS "$F/__/auth/$js" -o /tmp/$js; done
          python3 - <<'PY'
          import re
          for f in ['iframe.js','handler.js']:
              s=open('/tmp/'+f).read()
              print('=====',f)
              for m in re.finditer(r'unauthorized-domain|UNAUTHORIZED_DOMAIN|INVALID_ORIGIN', s):
                  i=m.start(); print('--- @',i); print(s[max(0,i-500):i+900])
              # find the function name defined containing "unauthorized-domain" and its call sites
              for m in re.finditer(r'var (\w+)=function\(a\)\{var b="unauthorized-domain"', s):
                  name=m.group(1); print('FN',name)
                  for c in re.finditer(r'[^\w.]'+re.escape(name)+r'\(', s):
                      j=c.start(); print('CALL @',j, s[max(0,j-600):j+200])
          PY
