# Temporário: gera as imagens do corpo realista (Body Coach) com IA de imagem grátis (Pollinations)
# e grava neste mesmo branch. Não vai para o develop.
name: Gerar corpos realistas
on:
  push:
    branches: [nexia/gerar-corpos]
    paths: [.github/workflows/gerar-corpos.yml]
permissions:
  contents: write
concurrency: { group: gerar-corpos, cancel-in-progress: false }
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        s: [m, f]
        p: [clara, media, morena, negra]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Gerar imagens (Workers AI, plano grátis)
        env:
          S: '${{ matrix.s }}'
          P: '${{ matrix.p }}'
          CF_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CF_CONTA: ${{ secrets.CLOUDFLARE_AI_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.NEXIA_D1_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          rm -rf corpos; mkdir -p corpos
          python3 - <<'PY'
          import base64, json, os, time, urllib.request, zlib
          S, P = os.environ['S'], os.environ['P']
          url = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CF_CONTA']}/ai/run/@cf/black-forest-labs/flux-1-schnell"
          sexo = {'m': 'man', 'f': 'woman'}[S]
          roupa = {'m': 'wearing only plain black athletic shorts, shirtless', 'f': 'wearing a plain black sports bra and plain black athletic shorts'}[S]
          pele = {'clara': 'fair white skin', 'media': 'light olive tan skin, brazilian', 'morena': 'brown skin, latino', 'negra': 'dark black skin, african descent'}[P]
          nivel = {'magro': 'lean muscular athletic body with visible abs, low body fat', 'medio': 'average fit body, slightly soft belly, moderate body fat', 'alto': 'overweight body with a round belly and love handles, high body fat'}
          vista = {'frente': 'facing the camera, front view', 'lado': 'in strict side profile facing right, side view', 'costas': 'seen from behind, back view, facing away from the camera'}
          log = open(f'corpos/log-{S}-{P}.txt', 'w')
          for n in nivel:
              seed = zlib.crc32(f'{S}{P}{n}'.encode()) % 100000
              for v in vista:
                  prompt = (f'full length studio photograph of an adult {sexo}, {pele}, {nivel[n]}, {roupa}, barefoot, '
                            f'standing straight and relaxed with arms slightly away from the body, {vista[v]}, '
                            'whole body from the top of the head to the feet visible with empty space above and below, centered, small in frame, '
                            'plain light gray seamless studio background, soft even lighting, photorealistic, realistic skin texture, sharp focus, DSLR')
                  for t in range(3):
                      try:
                          req = urllib.request.Request(url, data=json.dumps({'prompt': prompt, 'steps': 6, 'seed': seed}).encode(),
                                                       headers={'Authorization': f"Bearer {os.environ['CF_TOKEN']}", 'Content-Type': 'application/json'})
                          r = json.load(urllib.request.urlopen(req, timeout=120))
                          img = base64.b64decode(r['result']['image'])
                          open(f'corpos/{S}-{P}-{n}-{v}.jpg', 'wb').write(img)
                          print(f'ok {S}-{P}-{n}-{v} {len(img)}', file=log, flush=True)
                          break
                      except Exception as e:
                          msg = getattr(e, 'read', lambda: b'')()[:300]
                          print(f'falhou {S}-{P}-{n}-{v} t{t} {e} {msg!r}', file=log, flush=True)
                          time.sleep(5 * (t + 1))
          PY
          cat corpos/log-*.txt
      - name: Gravar no branch
        if: always()
        run: |
          git config user.name "nexia-bot"
          git config user.email "nexia-bot@users.noreply.github.com"
          git add corpos
          git commit -m "chore: corpos ${{ matrix.s }}-${{ matrix.p }} (temporário)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin nexia/gerar-corpos && git push origin HEAD:nexia/gerar-corpos && break; sleep $((i*5)); done
