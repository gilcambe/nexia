# Temporário: gera as imagens do corpo realista (Body Coach) com IA de imagem grátis (Pollinations)
# e grava neste mesmo branch. Não vai para o develop.
name: Gerar corpos realistas
on:
  push:
    branches: [nexia/gerar-corpos]
    paths: [.github/workflows/gerar-corpos.yml]
permissions:
  contents: write
concurrency: { group: gerar-corpos, cancel-in-progress: false }
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        s: [m, f]
        p: [clara, media, morena, negra]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Gerar imagens (Pollinations, sem chave)
        env: { S: '${{ matrix.s }}', P: '${{ matrix.p }}' }
        shell: bash
        run: |
          set +e
          rm -rf corpos; mkdir -p corpos
          python3 - <<'PY'
          import os, time, urllib.parse, urllib.request, zlib
          S, P = os.environ['S'], os.environ['P']
          sexo = {'m': 'man', 'f': 'woman'}[S]
          roupa = {'m': 'wearing only plain black athletic shorts, shirtless', 'f': 'wearing a plain black sports bra and plain black athletic shorts'}[S]
          pele = {'clara': 'fair white skin', 'media': 'light olive tan skin, brazilian', 'morena': 'brown skin, latino', 'negra': 'dark black skin, african descent'}[P]
          nivel = {'magro': 'lean muscular athletic body with visible abs, low body fat', 'medio': 'average fit body, slightly soft belly, moderate body fat', 'alto': 'overweight body with a round belly and love handles, high body fat'}
          vista = {'frente': 'facing the camera, front view', 'lado': 'in strict side profile facing right, side view', 'costas': 'seen from behind, back view, facing away from the camera'}
          log = open(f'corpos/log-{S}-{P}.txt', 'w')
          for n in nivel:
              seed = zlib.crc32(f'{S}{P}{n}'.encode()) % 100000
              for v in vista:
                  prompt = (f'RAW photo, full length studio photograph of an adult {sexo}, {pele}, {nivel[n]}, {roupa}, barefoot, standing straight and relaxed, '
                            f'arms slightly away from the body, {vista[v]}, whole body from the top of the head to the feet, feet fully visible on the floor with empty floor below, '
                            'centered, plain light gray seamless studio background, soft even lighting, photorealistic, detailed natural skin texture, sharp focus, 85mm DSLR')
                  url = 'https://image.pollinations.ai/prompt/' + urllib.parse.quote(prompt) + f'?width=768&height=1152&nologo=true&model=flux&seed={seed}'
                  for t in range(3):
                      try:
                          img = urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'nexia-bodycoach'}), timeout=120).read()
                          if img[:3] == b'\xff\xd8\xff' or img[:4] == b'\x89PNG':
                              open(f'corpos/{S}-{P}-{n}-{v}.jpg', 'wb').write(img)
                              print(f'ok {S}-{P}-{n}-{v} {len(img)}', file=log, flush=True)
                              break
                          print(f'nao-imagem {S}-{P}-{n}-{v} {img[:120]!r}', file=log, flush=True)
                      except Exception as e:
                          print(f'falhou {S}-{P}-{n}-{v} t{t} {e}', file=log, flush=True)
                      time.sleep(10 * (t + 1))
                  time.sleep(3)
          PY
          cat corpos/log-*.txt
      - name: Gravar no branch
        if: always()
        run: |
          git config user.name "nexia-bot"
          git config user.email "nexia-bot@users.noreply.github.com"
          git add corpos
          git commit -m "chore: corpos ${{ matrix.s }}-${{ matrix.p }} (temporário)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin nexia/gerar-corpos && git push origin HEAD:nexia/gerar-corpos && break; sleep $((i*5)); done
