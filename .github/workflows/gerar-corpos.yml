# Temporário: gera as imagens do corpo realista (Body Coach) com IA de imagem grátis (Pollinations)
# e grava neste mesmo branch. Não vai para o develop.
name: Gerar corpos realistas
on:
  push:
    branches: [nexia/gerar-corpos]
    paths: [.github/workflows/gerar-corpos.yml]
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Gerar imagens
        run: |
          set -u
          mkdir -p corpos
          sexo_txt() { [ "$1" = m ] && echo "man" || echo "woman"; }
          roupa() { [ "$1" = m ] && echo "wearing only plain black athletic shorts, shirtless" || echo "wearing a plain black sports bra and plain black athletic shorts"; }
          pele_txt() { case "$1" in clara) echo "fair white skin";; media) echo "light brown tan skin";; morena) echo "brown skin, latino";; negra) echo "dark black skin, african descent";; esac; }
          nivel_txt() { case "$1" in magro) echo "very lean muscular athletic physique with visible abs, about 10 percent body fat";; medio) echo "fit average physique, slightly soft, about 18 percent body fat";; alto) echo "overweight physique with belly fat, about 28 percent body fat";; esac; }
          vista_txt() { case "$1" in frente) echo "facing the camera, front view";; lado) echo "standing in strict side profile facing right, side view";; costas) echo "seen from behind, back view, facing away from the camera";; esac; }
          for s in m f; do for p in clara media morena negra; do for n in magro medio alto; do
            seed=$(( $(printf '%s' "$s$p$n" | cksum | cut -d' ' -f1) % 100000 ))
            for v in frente lado costas; do
              out="corpos/$s-$p-$n-$v.jpg"
              prompt="full body studio photograph of an adult $(sexo_txt $s), $(pele_txt $p), $(nivel_txt $n), $(roupa $s), barefoot, standing straight and relaxed with arms hanging slightly away from the body, $(vista_txt $v), entire body from head to feet visible and centered, plain light gray seamless studio background, soft even lighting, photorealistic, ultra realistic skin texture, sharp focus, 85mm"
              url="https://image.pollinations.ai/prompt/$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$prompt")?width=592&height=800&nologo=true&model=flux&seed=$seed"
              for t in 1 2 3 4 5; do
                if curl -sfL --max-time 180 -o "$out.tmp" "$url" && file "$out.tmp" | grep -qiE 'jpeg|png|webp'; then
                  convert "$out.tmp" -resize 592x800^ -gravity center -extent 592x800 -quality 82 "$out" && rm -f "$out.tmp" && echo "ok $out" && break
                fi
                echo "falhou $out tentativa $t"; sleep $((t*10))
              done
              sleep 3
            done
          done; done; done
          ls corpos | wc -l
      - name: Gravar no branch
        run: |
          git config user.name "nexia-bot"
          git config user.email "nexia-bot@users.noreply.github.com"
          git add corpos
          git commit -m "chore: corpos realistas gerados (temporário)" || exit 0
          git push origin HEAD:nexia/gerar-corpos
