# Temporário: gera de novo as fotos listadas em corpos-pedidos.txt pela rota /api/corpo-ia do
# Worker (Workers AI grátis), duas versões de cada, e grava neste branch. Não vai para o develop.
name: Gerar corpos realistas
on:
  push:
    branches: [nexia/gerar-corpos]
    paths: [.github/workflows/gerar-corpos.yml, corpos-pedidos.txt]
permissions:
  contents: write
concurrency: { group: gerar-corpos, cancel-in-progress: true }
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Gerar imagens
        shell: bash
        run: |
          set +e
          curl -s --max-time 90 -o /tmp/t.bin -w 'diag http=%{http_code} type=%{content_type}\n' "https://nexia.gcbezerra.workers.dev/api/corpo-ia?k=m-clara-medio-frente&v=diag$RANDOM"
          head -c 400 /tmp/t.bin | tr -c '[:print:]\n' '.'; echo
          rm -rf corpos; mkdir -p corpos; log=corpos/log.txt
          for k in $(cat corpos-pedidos.txt); do for n in 1 2; do
            for t in 1 2 3; do
              code=$(curl -s --max-time 90 -o "corpos/${k}__$n.jpg" -w '%{http_code}' "https://nexia.gcbezerra.workers.dev/api/corpo-ia?k=$k&v=$n$t$RANDOM")
              echo "$k $n t$t http=$code" >> $log
              [ "$code" = 200 ] && break
              rm -f "corpos/${k}__$n.jpg"; sleep $((t*5))
            done
          done; done
          grep -c http=200 $log
      - name: Gravar no branch
        if: always()
        run: |
          git config user.name "nexia-bot"
          git config user.email "nexia-bot@users.noreply.github.com"
          git add corpos
          git commit -m "chore: corpos refeitos (temporário)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin nexia/gerar-corpos && git push origin HEAD:nexia/gerar-corpos && break; sleep $((i*5)); done
