# Central → Conectar IAs (#1958): testa as chaves das 10 vagas (IA_VAGA_1..10) e grava só o resultado na issue de estado.
# Roda pelo botão "Testar agora" da Central e uma vez por dia.
name: IA Vagas (teste)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: ia-vagas
  cancel-in-progress: true

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Testar as vagas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IA_VAGA_1: ${{ secrets.IA_VAGA_1 }}
          IA_VAGA_2: ${{ secrets.IA_VAGA_2 }}
          IA_VAGA_3: ${{ secrets.IA_VAGA_3 }}
          IA_VAGA_4: ${{ secrets.IA_VAGA_4 }}
          IA_VAGA_5: ${{ secrets.IA_VAGA_5 }}
          IA_VAGA_6: ${{ secrets.IA_VAGA_6 }}
          IA_VAGA_7: ${{ secrets.IA_VAGA_7 }}
          IA_VAGA_8: ${{ secrets.IA_VAGA_8 }}
          IA_VAGA_9: ${{ secrets.IA_VAGA_9 }}
          IA_VAGA_10: ${{ secrets.IA_VAGA_10 }}
          IA_VAGA_11: ${{ secrets.IA_VAGA_11 }}
          IA_VAGA_12: ${{ secrets.IA_VAGA_12 }}
          IA_VAGA_13: ${{ secrets.IA_VAGA_13 }}
          IA_VAGA_14: ${{ secrets.IA_VAGA_14 }}
          IA_VAGA_15: ${{ secrets.IA_VAGA_15 }}
          IA_VAGA_16: ${{ secrets.IA_VAGA_16 }}
          IA_VAGA_17: ${{ secrets.IA_VAGA_17 }}
          IA_VAGA_18: ${{ secrets.IA_VAGA_18 }}
          IA_VAGA_19: ${{ secrets.IA_VAGA_19 }}
          IA_VAGA_20: ${{ secrets.IA_VAGA_20 }}
          IA_VAGA_21: ${{ secrets.IA_VAGA_21 }}
          IA_VAGA_22: ${{ secrets.IA_VAGA_22 }}
          IA_VAGA_23: ${{ secrets.IA_VAGA_23 }}
