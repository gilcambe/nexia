# Teste de pessoa no Viajante Pro no endereço real (cria e apaga dados marcados TESTE AUTOMATICO).
name: Viajante Pro teste no ar
on:
  push:
    branches: ['teste/vp-no-ar-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: npm i --no-save --no-audit --no-fund playwright@1.59.1 && npx playwright install --with-deps chromium
      - run: node tests/e2e/vp-humano-no-ar.js
        env:
          OUT: relatorio
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vp-teste-no-ar
          path: relatorio
