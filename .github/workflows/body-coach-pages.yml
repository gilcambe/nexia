name: Body Coach no Pages (link sem gcbezerra)
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths: ['apps/body-coach/pages-proxy/**']
permissions:
  contents: read
jobs:
  pages:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/body-coach/pages-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler@3 pages project create nexiabodycoach --production-branch main >/dev/null 2>&1 || true
          npx -y wrangler@3 pages deploy public --project-name nexiabodycoach --branch main
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/nexiabodycoach" | jq -r '.result.subdomain')
          echo "### Link do Body Coach: https://$SUB/body-coach/" >> "$GITHUB_STEP_SUMMARY"
