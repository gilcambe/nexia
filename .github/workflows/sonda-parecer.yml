name: Sonda parecer (temporaria)
on:
  push:
    branches: [nexia/bezsan-parecer-completo]
    paths: [.github/workflows/sonda-parecer.yml]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Sondar
        run: |
          set +e
          UA="NEXIA-Bezsan/1.0 (contato gcbezerra@gmail.com)"
          o=saida.txt
          t(){ echo "=== $1" >> $o; curl -s -m 25 -A "$UA" -H "Origin: https://bezsan.pages.dev" -D h.txt -o b.txt "${@:2}" || echo "curl falhou $?" >> $o; head -1 h.txt >> $o; grep -i '^access-control' h.txt >> $o; head -c 1500 b.txt >> $o; echo >> $o; }
          t pop6579 -g "https://servicodados.ibge.gov.br/api/v3/agregados/6579/periodos/2015|2021|2024|2025/variaveis/9324?localidades=N6[3509502]"
          t censo4709 -g "https://servicodados.ibge.gov.br/api/v3/agregados/4709/periodos/2022/variaveis/93|10605?localidades=N6[3509502]"
          t pib5938 -g "https://servicodados.ibge.gov.br/api/v3/agregados/5938/periodos/2016|2021/variaveis/37?localidades=N6[3509502]"
          t ind -g "https://servicodados.ibge.gov.br/api/v1/pesquisas/indicadores/47001|29167|96385|60036|60032|29765/resultados/350950"
          t indmeta -g "https://servicodados.ibge.gov.br/api/v1/pesquisas/indicadores/47001|29167|96385|60036|60032|29765|29171|60037"
          t overpass-cats -X POST --data-urlencode 'data=[out:json][timeout:25];(nwr(around:1000,-22.9056,-47.0608)[amenity~"^(school|kindergarten|college|university)$"];);out count;(nwr(around:1000,-22.9056,-47.0608)[amenity~"^(hospital|clinic|doctors|pharmacy)$"];);out count;(nwr(around:1000,-22.9056,-47.0608)[shop~"^(supermarket|convenience|bakery)$"];);out count;(nwr(around:1000,-22.9056,-47.0608)[highway=bus_stop];nwr(around:1000,-22.9056,-47.0608)[railway~"^(station|subway_entrance)$"];);out count;(nwr(around:1000,-22.9056,-47.0608)[leisure~"^(park|playground|sports_centre)$"];);out count;(nwr(around:1000,-22.9056,-47.0608)[amenity~"^(bank|restaurant|cafe)$"];);out count;' https://overpass-api.de/api/interpreter
          t nominatim2 "https://nominatim.openstreetmap.org/search?street=Rua+Barao+de+Jaguara+1000&city=Campinas&state=SP&country=Brasil&format=json&limit=1"
      - name: Publicar
        run: |
          set +e
          git config user.name nexia-bot; git config user.email bot@nexia.invalid
          git checkout -b sondas-parecer-${{ github.run_id }}
          git add saida.txt; git commit -qm sonda; git push -q origin sondas-parecer-${{ github.run_id }}
