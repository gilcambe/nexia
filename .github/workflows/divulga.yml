# NEXIA Divulga: posta os clientes da NEXIA sozinho, 3x por dia nos horários de mais movimento (7h15, 12h15 e 19h15 de Brasília).
# Primeiro a fila pronta (divulga/fila), depois o rodízio com texto da IA. Estado na branch "divulga-dados".
name: Divulga NEXIA

on:
  schedule:
    - cron: '15 10,15,22 * * *'
  workflow_dispatch:
    inputs:
      acao:
        description: 'O que fazer'
        type: choice
        options: [rodar, ensaio]
        default: rodar

permissions:
  contents: write

concurrency:
  group: divulga
  cancel-in-progress: false

jobs:
  divulga:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Abrir os dados
        run: |
          git config user.name "NEXIA Divulga"
          git config user.email "divulga@nexia.invalid"
          if git fetch -q --depth 1 origin divulga-dados; then
            git worktree add -q -B divulga-dados dados FETCH_HEAD
          else
            git worktree add -q --orphan -b divulga-dados dados
          fi
      # Linha de produção (#992): roteiro > telas com a cor do cliente > reel (só no horário das 19h15) > post.json.
      # Os arquivos vão para a branch "divulga-midia" (só a última produção, sobrescrita) para virar URL pública raw.
      # Se falhar, o robô posta o de sempre.
      - name: Produzir o post do cliente da vez
        id: produzir
        if: ${{ github.event_name == 'schedule' || inputs.acao == 'rodar' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core; }
          npm install --no-save --no-audit --no-fund @playwright/test@1.59.1
          npx playwright install --with-deps chromium
          git worktree add -q --orphan -b divulga-midia midia
          node divulga/produzir.js auto midia/producao --dados dados
          cd midia
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "midia do Divulga"
          git push -q -f origin divulga-midia
          sleep 15
      - name: Postar
        env:
          ACAO: ${{ github.event_name == 'schedule' && 'rodar' || inputs.acao }}
          PRODUCAO: ${{ steps.produzir.outcome == 'success' && 'midia/producao' || '' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIVULGA_META_PAGE_ID: ${{ secrets.DIVULGA_META_PAGE_ID }}
          DIVULGA_META_PAGE_TOKEN: ${{ secrets.DIVULGA_META_PAGE_TOKEN }}
          DIVULGA_META_IG_USER_ID: ${{ secrets.DIVULGA_META_IG_USER_ID }}
          DIVULGA_THREADS_USER_ID: ${{ secrets.DIVULGA_THREADS_USER_ID }}
          DIVULGA_THREADS_TOKEN: ${{ secrets.DIVULGA_THREADS_TOKEN }}
          DIVULGA_PINTEREST_APP_ID: ${{ secrets.DIVULGA_PINTEREST_APP_ID }}
          DIVULGA_PINTEREST_APP_SECRET: ${{ secrets.DIVULGA_PINTEREST_APP_SECRET }}
          DIVULGA_PINTEREST_REFRESH_TOKEN: ${{ secrets.DIVULGA_PINTEREST_REFRESH_TOKEN }}
          DIVULGA_PINTEREST_BOARD_ID: ${{ secrets.DIVULGA_PINTEREST_BOARD_ID }}
          DIVULGA_BLUESKY_HANDLE: ${{ secrets.DIVULGA_BLUESKY_HANDLE }}
          DIVULGA_BLUESKY_APP_PASSWORD: ${{ secrets.DIVULGA_BLUESKY_APP_PASSWORD }}
        run: node divulga/robo.js "$ACAO" --dados dados ${PRODUCAO:+--producao "$PRODUCAO"}
      - name: Gerar carrossel, story, antes e depois e reel (só no ensaio)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.acao == 'ensaio' }}
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core; }
          npm install --no-save --no-audit --no-fund @playwright/test@1.59.1
          npx playwright install --with-deps chromium
          node divulga/gerar.js divulga-ensaio
          node divulga/produzir.js auto divulga-ensaio/producao --dados dados --reel
      - name: Mostrar o ensaio para o dono
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.acao == 'ensaio' }}
        uses: actions/upload-artifact@v4
        with:
          name: divulga-ensaio
          path: divulga-ensaio/
          retention-days: 14
      - name: Guardar os dados
        if: always()
        run: |
          cd dados
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "dados do Divulga"
          git push -q origin divulga-dados
      - name: Mostrar estatísticas de seguidores
        if: always()
        continue-on-error: true
        run: |
          node -e "
          const fs = require('fs');
          try {
            const data = JSON.parse(fs.readFileSync('dados/divulga-estado.json', 'utf8'));
            if (!data.estado || !data.estado.seguidores || data.estado.seguidores.length === 0) {
              console.log('## Sem dados de seguidores ainda');
              process.exit(0);
            }
            
            const seguidores = data.estado.seguidores.slice(-14);
            const primeiro = seguidores[0].total;
            const ultimo = seguidores[seguidores.length - 1].total;
            const diferenca = ultimo - primeiro;
            
            console.log('## Estatísticas de seguidores (últimos 14 dias)');
            console.log('| Dia | Total |');
            console.log('|-----|-------|');
            
            seguidores.forEach(item => {
              console.log('| ' + item.dia + ' | ' + item.total + ' |');
            });
            
            const sinal = diferenca >= 0 ? '+' : '';
            console.log('\n**' + sinal + diferenca + ' seguidores em 14 dias**');
          } catch (error) {
            console.log('## Sem dados de seguidores ainda');
          }
          " >> $GITHUB_STEP_SUMMARY
