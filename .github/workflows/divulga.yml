# NEXIA Divulga: posta os clientes da NEXIA sozinho, 3x por dia nos horários de mais movimento (7h15, 12h15 e 19h15 de Brasília).
# Primeiro a fila pronta (divulga/fila), depois o rodízio com texto da IA. Estado na branch "divulga-dados".
name: Divulga NEXIA

on:
  schedule:
    - cron: '15 10,15,22 * * *'
  workflow_dispatch:
    inputs:
      acao:
        description: 'O que fazer'
        type: choice
        options: [rodar, ensaio]
        default: rodar

permissions:
  contents: write

concurrency:
  group: divulga
  cancel-in-progress: false

jobs:
  divulga:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Abrir os dados
        run: |
          git config user.name "NEXIA Divulga"
          git config user.email "divulga@nexia.invalid"
          if git fetch -q --depth 1 origin divulga-dados; then
            git worktree add -q -B divulga-dados dados FETCH_HEAD
          else
            git worktree add -q --orphan -b divulga-dados dados
          fi
      - name: Postar
        env:
          ACAO: ${{ github.event_name == 'schedule' && 'rodar' || inputs.acao }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIVULGA_META_PAGE_ID: ${{ secrets.DIVULGA_META_PAGE_ID }}
          DIVULGA_META_PAGE_TOKEN: ${{ secrets.DIVULGA_META_PAGE_TOKEN }}
          DIVULGA_META_IG_USER_ID: ${{ secrets.DIVULGA_META_IG_USER_ID }}
          DIVULGA_THREADS_USER_ID: ${{ secrets.DIVULGA_THREADS_USER_ID }}
          DIVULGA_THREADS_TOKEN: ${{ secrets.DIVULGA_THREADS_TOKEN }}
          DIVULGA_PINTEREST_APP_ID: ${{ secrets.DIVULGA_PINTEREST_APP_ID }}
          DIVULGA_PINTEREST_APP_SECRET: ${{ secrets.DIVULGA_PINTEREST_APP_SECRET }}
          DIVULGA_PINTEREST_REFRESH_TOKEN: ${{ secrets.DIVULGA_PINTEREST_REFRESH_TOKEN }}
          DIVULGA_PINTEREST_BOARD_ID: ${{ secrets.DIVULGA_PINTEREST_BOARD_ID }}
          DIVULGA_BLUESKY_HANDLE: ${{ secrets.DIVULGA_BLUESKY_HANDLE }}
          DIVULGA_BLUESKY_APP_PASSWORD: ${{ secrets.DIVULGA_BLUESKY_APP_PASSWORD }}
        run: node divulga/robo.js "$ACAO" --dados dados
      - name: Gerar carrossel, story, antes e depois e reel (só no ensaio)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.acao == 'ensaio' }}
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.59.1
          npx playwright install --with-deps chromium
          node divulga/gerar.js divulga-ensaio
      - name: Mostrar o ensaio para o dono
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.acao == 'ensaio' }}
        uses: actions/upload-artifact@v4
        with:
          name: divulga-ensaio
          path: divulga-ensaio/
          retention-days: 14
      - name: Guardar os dados
        if: always()
        run: |
          cd dados
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "dados do Divulga"
          git push -q origin divulga-dados
