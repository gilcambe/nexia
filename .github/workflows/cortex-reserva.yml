# NEXIA — Reserva do Cortex: quando o Cortex e o Jules travam (cloudflare/jules-auto.js) ou a Claude fica sem créditos, uma conta grátis ligada (Gemini, OpenAI, Anthropic, OpenRouter)
# aplica a issue cortex-fila e abre PR nexia/reserva-N. Tenta cada conta na ordem; em erro de cota passa para a próxima.
name: Cortex Reserva

on:
  workflow_dispatch:
    inputs:
      numero:
        description: Número da issue cortex-fila a aplicar
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: cortex-reserva-${{ inputs.numero }}
  cancel-in-progress: false

jobs:
  reserva:
    name: Reserva #${{ inputs.numero }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    env:
      NUMERO: ${{ inputs.numero }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RESERVA_GEMINI_KEY: ${{ secrets.RESERVA_GEMINI_KEY }}
      RESERVA_OPENAI_KEY: ${{ secrets.RESERVA_OPENAI_KEY }}
      RESERVA_ANTHROPIC_KEY: ${{ secrets.RESERVA_ANTHROPIC_KEY }}
      RESERVA_OPENROUTER_KEY: ${{ secrets.RESERVA_OPENROUTER_KEY }}
      # Contas grátis que o Cortex já usa (um segredo por linha): entram como reserva extra quando o Gemini estoura a cota do dia.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # #1958: vagas da Central (Conectar IAs). Valor "provedor:chave"; entram primeiro.
      IA_VAGAS_CONFIG: ${{ vars.IA_VAGAS_CONFIG }}  # #2808 pausadas e ordem (sem chave)
      IA_VAGA_1: ${{ secrets.IA_VAGA_1 }}
      IA_VAGA_2: ${{ secrets.IA_VAGA_2 }}
      IA_VAGA_3: ${{ secrets.IA_VAGA_3 }}
      IA_VAGA_4: ${{ secrets.IA_VAGA_4 }}
      IA_VAGA_5: ${{ secrets.IA_VAGA_5 }}
      IA_VAGA_6: ${{ secrets.IA_VAGA_6 }}
      IA_VAGA_7: ${{ secrets.IA_VAGA_7 }}
      IA_VAGA_8: ${{ secrets.IA_VAGA_8 }}
      IA_VAGA_9: ${{ secrets.IA_VAGA_9 }}
      IA_VAGA_10: ${{ secrets.IA_VAGA_10 }}
      IA_VAGA_11: ${{ secrets.IA_VAGA_11 }}
      IA_VAGA_12: ${{ secrets.IA_VAGA_12 }}
      IA_VAGA_13: ${{ secrets.IA_VAGA_13 }}
      IA_VAGA_14: ${{ secrets.IA_VAGA_14 }}
      IA_VAGA_15: ${{ secrets.IA_VAGA_15 }}
      IA_VAGA_16: ${{ secrets.IA_VAGA_16 }}
      IA_VAGA_17: ${{ secrets.IA_VAGA_17 }}
      IA_VAGA_18: ${{ secrets.IA_VAGA_18 }}
      IA_VAGA_19: ${{ secrets.IA_VAGA_19 }}
      IA_VAGA_20: ${{ secrets.IA_VAGA_20 }}
      IA_VAGA_21: ${{ secrets.IA_VAGA_21 }}
      IA_VAGA_22: ${{ secrets.IA_VAGA_22 }}
      IA_VAGA_23: ${{ secrets.IA_VAGA_23 }}
      IA_VAGA_24: ${{ secrets.IA_VAGA_24 }}
      IA_VAGA_25: ${{ secrets.IA_VAGA_25 }}
      IA_VAGA_26: ${{ secrets.IA_VAGA_26 }}
      IA_VAGA_27: ${{ secrets.IA_VAGA_27 }}
      IA_VAGA_28: ${{ secrets.IA_VAGA_28 }}
      IA_VAGA_29: ${{ secrets.IA_VAGA_29 }}
      IA_VAGA_30: ${{ secrets.IA_VAGA_30 }}
      IA_VAGA_31: ${{ secrets.IA_VAGA_31 }}
      IA_VAGA_32: ${{ secrets.IA_VAGA_32 }}
      IA_VAGA_33: ${{ secrets.IA_VAGA_33 }}
      IA_VAGA_34: ${{ secrets.IA_VAGA_34 }}
      IA_VAGA_35: ${{ secrets.IA_VAGA_35 }}
      IA_VAGA_36: ${{ secrets.IA_VAGA_36 }}
      IA_VAGA_37: ${{ secrets.IA_VAGA_37 }}
      IA_VAGA_38: ${{ secrets.IA_VAGA_38 }}
      IA_VAGA_39: ${{ secrets.IA_VAGA_39 }}
      IA_VAGA_40: ${{ secrets.IA_VAGA_40 }}
      IA_VAGA_41: ${{ secrets.IA_VAGA_41 }}
      IA_VAGA_42: ${{ secrets.IA_VAGA_42 }}
      IA_VAGA_43: ${{ secrets.IA_VAGA_43 }}
      IA_VAGA_44: ${{ secrets.IA_VAGA_44 }}
      IA_VAGA_45: ${{ secrets.IA_VAGA_45 }}
      IA_VAGA_46: ${{ secrets.IA_VAGA_46 }}
      IA_VAGA_47: ${{ secrets.IA_VAGA_47 }}
      IA_VAGA_48: ${{ secrets.IA_VAGA_48 }}
      IA_VAGA_49: ${{ secrets.IA_VAGA_49 }}
      IA_VAGA_50: ${{ secrets.IA_VAGA_50 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Instalar Aider
        run: |
          python3 -m venv "$RUNNER_TEMP/aider-venv"
          "$RUNNER_TEMP/aider-venv/bin/pip" install --quiet --prefer-binary aider-chat
          echo "$RUNNER_TEMP/aider-venv/bin" >> "$GITHUB_PATH"
      - name: Ler a issue
        run: |
          gh issue view "$NUMERO" --json title,body --jq '"# " + .title + "\n\n" + .body' > "$RUNNER_TEMP/tarefa.md"
          echo "Tarefa:"; head -c 600 "$RUNNER_TEMP/tarefa.md"
      - name: Arquivos citados na tarefa
        run: |
          grep -oE '`[A-Za-z0-9_./-]+/[A-Za-z0-9_.-]+\.[a-z]{1,5}`' "$RUNNER_TEMP/tarefa.md" | tr -d '`' | sort -u | head -8 > "$RUNNER_TEMP/arquivos.txt" || true
          echo "Arquivos:"; cat "$RUNNER_TEMP/arquivos.txt"
      - name: Aplicar com a primeira conta que responder
        id: aplicar
        run: |
          git config user.name "nexia-reserva"
          git config user.email "reserva@users.noreply.github.com"
          git checkout -q -b "nexia/reserva-$NUMERO-$GITHUB_RUN_NUMBER"
          PROMPT="Aplique esta tarefa no repositório. Só grátis, não remova nenhuma função existente. $(cat "$RUNNER_TEMP/tarefa.md")"
          contas=()
          # Nomes de modelo morrem com o tempo (gemini-2.5-flash, llama-3.3-70b-versatile, deepseek :free, NVIDIA llama 410).
          # Em vez de nome fixo, pergunta a cada provedor quais modelos existem AGORA (mesma correção do avaya-gsd #17).
          mod_gemini() { curl -sS "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=$1" 2>/dev/null | jq -r '[.models[]?|select(.supportedGenerationMethods|index("generateContent"))|.name|select(test("flash"))|select(test("image|tts|live|thinking|exp|preview|audio|omni|robotics")|not)] as $m | ([$m[]|select(test("lite")|not)]|sort|reverse|.[0:3][]), ([$m[]|select(test("lite"))]|sort|reverse|.[0:2][])' 2>/dev/null | sed 's#^models/##' | awk '!v[$0]++'; }
          mod_groq() { curl -sS -H "Authorization: Bearer $1" https://api.groq.com/openai/v1/models 2>/dev/null | jq -r '[.data[]?|select(.active!=false)|select(.id|test("whisper|tts|guard|playai|orpheus|prompt|vision";"i")|not)]|sort_by(-(.context_window//0))|.[0:3][]|.id' 2>/dev/null; }
          mod_or() { curl -sS https://openrouter.ai/api/v1/models 2>/dev/null | jq -r '[.data[]?|select(.id|endswith(":free"))|select((.context_length//0)>=100000)]|sort_by((if (.id|test("coder|code|qwen3|deepseek";"i")) then 0 else 1 end), -(.context_length//0))|.[0:3][]|.id' 2>/dev/null; }
          mod_nvidia() { curl -sS -H "Authorization: Bearer $1" https://integrate.api.nvidia.com/v1/models 2>/dev/null | jq -r '[.data[]?.id|select(test("embed|rerank|guard|vision|vl|reward|safety|parse|clip|retriev";"i")|not)]|sort_by(if test("coder";"i") then 0 elif test("qwen3|deepseek|kimi|glm";"i") then 1 else 2 end)|.[0:2][]' 2>/dev/null; }
          add_gemini() { local nome=$1 ch=$2 m; for m in $(mod_gemini "$ch"); do contas+=("$nome|gemini/$m|GEMINI_API_KEY|$ch"); done; }
          add_groq() { local nome=$1 ch=$2 m; for m in $(mod_groq "$ch"); do contas+=("$nome|groq/$m|GROQ_API_KEY|$ch"); done; }
          add_or() { local nome=$1 ch=$2 m; for m in $(mod_or); do contas+=("$nome|openrouter/$m|OPENROUTER_API_KEY|$ch"); done; }
          add_nvidia() { local nome=$1 ch=$2 m; for m in $(mod_nvidia "$ch"); do contas+=("$nome|nvidia_nim/$m|NVIDIA_NIM_API_KEY|$ch"); done; }
          ORDEM=$(node -e "const v=require('./nexia-ai/model-router/vagas');const c=v.lerConfig(process.env);const p=n=>{const i=c.ordem.indexOf(n);return i<0?1000+n:i};console.log(Array.from({length:v.MAX_VAGAS},(_,i)=>i+1).filter(n=>!c.pausadas.includes(n)).sort((a,b)=>p(a)-p(b)).join(' '))" 2>/dev/null || seq 1 50)
          for N in $ORDEM; do  # 50 vagas da Central (#2716), sem as pausadas e na ordem da Central (#2808)
            V="IA_VAGA_$N"; V="${!V}"
            [ -z "$V" ] && continue
            PROV="${V%%:*}"; CH="${V#*:}"
            echo "::add-mask::$CH"
            case "$PROV" in
              gemini) add_gemini "vaga-$N-gemini" "$CH" ;;
              groq) add_groq "vaga-$N-groq" "$CH" ;;
              openrouter) add_or "vaga-$N-openrouter" "$CH" ;;
              mistral) contas+=("vaga-$N-mistral|mistral/codestral-latest|MISTRAL_API_KEY|$CH") ;;
              cohere) contas+=("vaga-$N-cohere|cohere_chat/command-a-03-2025|COHERE_API_KEY|$CH") ;;
              huggingface) contas+=("vaga-$N-huggingface|huggingface/meta-llama/Llama-3.3-70B-Instruct|HUGGINGFACE_API_KEY|$CH") ;;
              codestral) contas+=("vaga-$N-codestral|codestral/codestral-latest|CODESTRAL_API_KEY|$CH") ;;
              nvidia) add_nvidia "vaga-$N-nvidia" "$CH" ;;
              zai) contas+=("vaga-$N-zai|openai/glm-4.5-flash|OPENAI_API_KEY|$CH|https://api.z.ai/api/paas/v4") ;;
              sambanova) contas+=("vaga-$N-sambanova|sambanova/Meta-Llama-3.3-70B-Instruct|SAMBANOVA_API_KEY|$CH") ;;
              custom)
                # #2716: "Outra IA" = base64url de {url, modelo, chave}; entra como modelo openai/ com OPENAI_API_BASE.
                CU=$(node -e 'try{const o=JSON.parse(Buffer.from(process.argv[1],"base64url").toString());if(/^https:\/\//.test(o.url)&&o.modelo&&o.chave)console.log([o.url.replace(/\/chat\/completions$/,""),o.modelo,o.chave].join("\t"))}catch{}' "$CH")
                [ -z "$CU" ] && continue
                IFS=$'\t' read -r CURL CMOD CKEY <<< "$CU"
                echo "::add-mask::$CKEY"
                contas+=("vaga-$N-custom|openai/$CMOD|OPENAI_API_KEY|$CKEY|$CURL") ;;
            esac
          done
          [ -n "$RESERVA_GEMINI_KEY" ] && add_gemini gemini "$RESERVA_GEMINI_KEY"
          [ -n "$GEMINI_API_KEY" ] && [ "$GEMINI_API_KEY" != "$RESERVA_GEMINI_KEY" ] && add_gemini gemini-cortex "$GEMINI_API_KEY"
          [ -n "$GROQ_API_KEY" ] && add_groq groq "$GROQ_API_KEY"
          [ -n "$MISTRAL_API_KEY" ] && contas+=("mistral|mistral/codestral-latest|MISTRAL_API_KEY|$MISTRAL_API_KEY")
          [ -n "$OPENROUTER_API_KEY" ] && add_or openrouter-cortex "$OPENROUTER_API_KEY"
          [ -n "$RESERVA_OPENROUTER_KEY" ] && add_or openrouter "$RESERVA_OPENROUTER_KEY"
          [ -n "$RESERVA_OPENAI_KEY" ] && contas+=("openai|gpt-4o-mini|OPENAI_API_KEY|$RESERVA_OPENAI_KEY")
          [ -n "$RESERVA_ANTHROPIC_KEY" ] && contas+=("anthropic|claude-3-5-haiku-20241022|ANTHROPIC_API_KEY|$RESERVA_ANTHROPIC_KEY")
          if [ ${#contas[@]} -eq 0 ]; then echo "Nenhuma conta de reserva ligada."; echo "ok=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Só conta como resultado se houver linha de código de verdade: arquivo novo VAZIO (a IA "terminou" sem escrever) não vale.
          tem_conteudo() {
            local f n=0
            while IFS= read -r f; do
              case "$f" in .aider*|.gitignore) continue ;; esac
              [ -s "$f" ] && n=$((n+1))
            done < <(git ls-files -m -o --exclude-standard)
            [ "$n" -gt 0 ]
          }
          # Trava de estrago: a IA às vezes "resume" o arquivo (frases de preenchimento) ou apaga quase tudo.
          # Reprova se uma linha ADICIONADA tiver frase de preenchimento, ou se um arquivo existente perder >= 30 linhas e mais que o dobro do que ganhou.
          sem_estrago() {
            if git diff -U0 | grep -E '^\+[^+]' | grep -qiE 'permanece inalterad|conteúdo existente|conteudo existente|resto (do arquivo|do código|igual)|rest of (the )?(file|code)|existing (code|content) (remains|here)|\.\.\. ?(existing|resto)|// \.\.\.|# \.\.\.'; then
              echo "Estrago: frase de preenchimento no código novo."; return 1
            fi
            local add del f
            while read -r add del f; do
              [ "$add" = "-" ] && continue
              if [ "$del" -ge 30 ] && [ "$del" -gt $((add*2)) ]; then
                echo "Estrago: $f perdeu $del linhas (ganhou $add)."; return 1
              fi
            done < <(git diff --numstat)
            return 0
          }
          for c in "${contas[@]}"; do
            IFS='|' read -r nome modelo var chave base <<< "$c"
            echo "Tentando conta: $nome"
            git reset -q --hard "origin/${GITHUB_REF_NAME}" || true
            if env "$var=$chave" ${base:+"OPENAI_API_BASE=$base"} aider --yes-always --no-auto-commits --no-gitignore --no-detect-urls --no-check-update --no-analytics --read AGENTS.md --read docs/CONTEXTO-IA.md --model "$modelo" --message "$PROMPT" $(tr '\n' ' ' < "$RUNNER_TEMP/arquivos.txt") 2>&1 | tail -40; tem_conteudo && sem_estrago; then
              echo "ok=1" >> "$GITHUB_OUTPUT"; echo "conta=$nome" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "Conta $nome sem resultado (cota/limite); próxima."
          done
          echo "ok=0" >> "$GITHUB_OUTPUT"
      - name: Testar
        if: steps.aplicar.outputs.ok == '1'
        run: npm test
      - name: Abrir PR
        if: steps.aplicar.outputs.ok == '1'
        env:
          GITHUB_APP_ID: ${{ secrets.NEXIA_GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.NEXIA_GITHUB_APP_PRIVATE_KEY }}
          REPO: ${{ github.repository }}
        run: |
          git add -A
          git reset -q -- '.aider*' .gitignore 2>/dev/null || true
          git commit -q -m "Reserva (${{ steps.aplicar.outputs.conta }}): issue #$NUMERO"
          git push -q origin "nexia/reserva-$NUMERO-$GITHUB_RUN_NUMBER"
          # PR aberto pela GitHub App do NEXIA: assim o CI roda nele (com o token padrão o GitHub não roda).
          APP_TOKEN=$(node -e "require('./scripts/cortex-fila').tokenDaApp().then(t=>process.stdout.write(t||''))" 2>/dev/null || true)
          [ -n "$APP_TOKEN" ] && export GH_TOKEN="$APP_TOKEN"
          gh pr create --base "$GITHUB_REF_NAME" --head "nexia/reserva-$NUMERO-$GITHUB_RUN_NUMBER" --title "Reserva: issue #$NUMERO" --body "Aplicado pela conta ${{ steps.aplicar.outputs.conta }}. Fecha #$NUMERO." --label automerge
      - name: Sem cota hoje
        if: steps.aplicar.outputs.ok != '1'
        run: |
          gh issue comment "$NUMERO" --body "Reserva: nenhuma conta ligada respondeu (sem cota ou sem chave). A fila tenta de novo amanhã."
          # #803: o rótulo segura a tarefa até o dia virar; a Central mostra o aviso e a fila reenfileira do zero.
          gh label create cortex-reserva-sem-cota --color FBCA04 --description "Reserva sem cota hoje: volta amanhã" 2>/dev/null || true
          gh issue edit "$NUMERO" --add-label cortex-reserva-sem-cota || true
          exit 1
