# Teste de carga do Cortex (#1629 / #2389). Só manual.
# falso (padrão): handler real do cortex-chat aqui no runner, com login e IA simulados; não toca a produção nem gasta cota.
# real: no máximo 5 mensagens de verdade; precisa do segredo CORTEX_CARGA_TOKEN (login de teste).
name: Cortex - teste de carga

on:
  workflow_dispatch:
    inputs:
      pessoas:
        description: 'Quantas pessoas ao mesmo tempo'
        type: choice
        options: ['50', '200', '1000']
        default: '50'
      modo:
        description: 'falso = IA simulada (seguro); real = até 5 mensagens de verdade'
        type: choice
        options: ['falso', 'real']
        default: 'falso'

permissions:
  contents: read

jobs:
  carga:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rodar
        env:
          CORTEX_CARGA_TOKEN: ${{ inputs.modo == 'real' && secrets.CORTEX_CARGA_TOKEN || '' }}
          MODO: ${{ inputs.modo }}
          PESSOAS: ${{ inputs.pessoas }}
        run: node scripts/cortex-carga.js "--$MODO" --pessoas "$PESSOAS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: carga-relatorio-${{ inputs.modo }}-${{ inputs.pessoas }}
          path: carga-relatorio-*.json
          if-no-files-found: warn
