# #3284 (parte 2 de #3272): Kernex nunca para. A cada 10 min, se uma IA (Claude, Jules...) parou de dar sinal
# no seu registro trabalho-ativo há mais de 15 min, os itens pendentes viram issues da fila no repo certo.
name: Passagem IA
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: passagem-ia
  cancel-in-progress: false
jobs:
  passagem:
    name: Passagem
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Passar o trabalho de quem parou
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A App do NEXIA também enxerga o repo privado do Avaya (issues ficam lá, nunca no nexia).
          GITHUB_APP_ID: ${{ secrets.NEXIA_GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.NEXIA_GITHUB_APP_PRIVATE_KEY }}
        run: node scripts/passagem-ia.js
