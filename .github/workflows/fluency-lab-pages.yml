# Objetivo: publica o Fluency Lab (treino de inglês) no Cloudflare Pages, grátis. Dono (13/11): "qual a url pra testar o inglês?"
# O arquivo é a versão "tudo num arquivo só" (roda no navegador, sem servidor). Link: https://<projeto>.pages.dev
name: Fluency Lab no Pages
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths: ['apps/fluency-lab/public/**', '.github/workflows/fluency-lab-pages.yml']
permissions:
  contents: read
jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Guardar o deploy anterior
        id: antes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/pages-volta.js antes fluency-lab
      - name: Publicar
        id: publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler@3 pages project create fluency-lab --production-branch main >/dev/null 2>&1 || true
          npx -y wrangler@3 pages deploy apps/fluency-lab/public --project-name fluency-lab --branch main
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/fluency-lab" | jq -r '.result.subdomain')
          echo "sub=$SUB" >> "$GITHUB_OUTPUT"
          echo "### Link do Fluency Lab: https://$SUB/" >> "$GITHUB_STEP_SUMMARY"
      - name: Teste do site no ar (se falhar, volta para o deploy anterior)
        if: steps.publicar.outputs.sub != '' && steps.publicar.outputs.sub != 'null'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/pages-volta.js conferir fluency-lab "https://${{ steps.publicar.outputs.sub }}/" "${{ steps.antes.outputs.anterior }}"
