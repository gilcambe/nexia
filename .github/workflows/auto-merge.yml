name: Merge automático

# ADR-OPS-02 (autorizado pelo dono em 2026-10-06): PRs com o rótulo "automerge" (branch nexia/...
# deste repositório, para develop) entram sozinhos quando todo o CI do último commit passa. O Claude
# põe o rótulo depois de revisar o PR (o dele ou o do Cortex); PR sem o rótulo nunca entra.
# Depois do merge o CI roda em develop, e o deploy automático segue dele.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [labeled, ready_for_review, synchronize]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  merge:
    name: Merge automático
    runs-on: ubuntu-latest
    steps:
      # Sem checkout: nenhum código do PR roda aqui.
      # Gate objetivo (autorizado pelo dono em 2026-10-06: "pense em algo que eu não precise ficar aprovando nada"):
      # PR de branch nexia/ deste repositório recebe o rótulo sozinho quando NÃO mexe em nada sensível
      # (regras do Firestore, workflows, scripts, segredos, autenticação, Worker/servidor) e não importa
      # dados de exemplo (mocks). O que for sensível continua esperando a revisão da Claude. PR de demonstração
      # (título com "demo" ou #50/#54/#57) nunca recebe o rótulo. Sem checkout: só lê a API.
      - name: Rotular PRs seguros do Cortex
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          prs=$(gh api "repos/$REPO/pulls?state=open&base=develop&per_page=50" \
            --jq '.[] | select(all(.labels[]; .name != "automerge" and .name != "revisao-manual")) | select(.head.repo.full_name == env.REPO) | select(.head.ref | startswith("nexia/")) | select(.title | test("demo"; "i") | not) | .number')
          for n in $prs; do
            case "$n" in 50|54|57) continue;; esac
            files=$(gh api "repos/$REPO/pulls/$n/files?per_page=100" --paginate --jq '.[].filename' || true)
            [ -z "$files" ] && continue
            if echo "$files" | grep -Eq '^(\.github/|scripts/|firestore\.rules|firestore\.indexes|cloudflare/|server\.js|lib/|nexia-ai/(policy-engine|tool-gateway|vault)/|package(-lock)?\.json|\.env|.*secret|.*credential|.*auth)'; then
              echo "PR #$n: mexe em área sensível; espera a revisão da Claude."
              continue
            fi
            if gh api "repos/$REPO/pulls/$n/files?per_page=100" --paginate --jq '.[]|select(.patch != null)|.patch' | grep -E "^\+.*(from ['\"]@/mocks/|from ['\"]\.\./mocks/)" >/dev/null; then
              echo "PR #$n: importa dados de exemplo (mocks); espera a revisão da Claude."
              continue
            fi
            # Portão de qualidade (melhoria 3 da análise do Cortex, 2026-10-07): sinais objetivos de entrega fora do pedido.
            # Qualquer um deles manda o PR para a revisão da Claude em vez de entrar sozinho.
            meta=$(gh api "repos/$REPO/pulls/$n" --jq '"\(.changed_files) \(.additions) \(.deletions)"')
            read -r nfiles nadd ndel <<<"$meta"
            if [ "$nfiles" -gt 30 ] || [ "$nadd" -gt 1500 ]; then
              echo "PR #$n: grande demais ($nfiles arquivos, +$nadd); espera a revisão da Claude."
              continue
            fi
            added=$(gh api "repos/$REPO/pulls/$n/files?per_page=100" --paginate --jq '.[]|select(.patch != null)|.patch' | grep -E '^\+' || true)
            if grep -Eiq 'router\.complete\(|lorem ipsum|TODO[: ]|FIXME|not implemented|process\.env\.[A-Z_]*(KEY|SECRET|TOKEN)' <<<"$added"; then
              echo "PR #$n: código com marca de inacabado ou API inventada; espera a revisão da Claude."
              continue
            fi
            if echo "$files" | grep -Eq '^tests/' && [ "$ndel" -gt "$nadd" ]; then
              echo "PR #$n: apaga mais do que acrescenta com testes no meio; espera a revisão da Claude."
              continue
            fi
            gh api -X POST "repos/$REPO/issues/$n/labels" -f "labels[]=automerge" >/dev/null && echo "PR #$n: rótulo automerge posto pelo gate (nada sensível, sem mocks, passou no portão de qualidade)."
          done

      - name: Fazer merge dos PRs prontos
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          merged=0
          prs=$(gh api "repos/$REPO/pulls?state=open&base=develop&per_page=50" \
            --jq '.[] | select(any(.labels[]; .name == "automerge")) | select(.head.repo.full_name == env.REPO) | select(.head.ref | startswith("nexia/")) | .number')
          for n in $prs; do
            pr=$(gh api "repos/$REPO/pulls/$n")
            sha=$(jq -r .head.sha <<<"$pr")
            # CI do último commit: tudo concluído e verde, e o job principal precisa existir.
            runs=$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" --jq '[.check_runs[] | select(.name != "Merge automático" and .name != "Testar com login")]')
            if ! jq -e 'any(.[]; .name == "Typecheck, testes e build") and all(.[]; .status == "completed" and (.conclusion == "success" or .conclusion == "skipped" or .conclusion == "neutral"))' <<<"$runs" >/dev/null; then
              echo "PR #$n: CI ainda não está verde em ${sha:0:7}; fica para a próxima."
              continue
            fi
            if [ "$(jq -r .mergeable <<<"$pr")" != "true" ]; then
              echo "PR #$n: com conflito ou ainda calculando; fica para a próxima."
              continue
            fi
            if [ "$(jq -r .draft <<<"$pr")" = "true" ]; then gh pr ready "$n" --repo "$REPO"; fi
            if gh api -X PUT "repos/$REPO/pulls/$n/merge" -f merge_method=merge -f sha="$sha" >/dev/null; then
              echo "PR #$n: merge feito."
              merged=1
              gh api -X DELETE "repos/$REPO/git/refs/heads/$(jq -r .head.ref <<<"$pr")" >/dev/null || true
            else
              echo "PR #$n: o GitHub recusou o merge agora; fica para a próxima."
            fi
          done
          # Merge feito com o token do Actions não dispara o CI de develop sozinho: dispara aqui.
          # O CI disparado pelo token também não dispara o deploy (workflow_run ignora runs do GITHUB_TOKEN),
          # então o deploy é disparado direto (autorizado pelo dono em 2026-10-06 12:59: "pode publicar").
          # O deploy roda os testes antes, testa o site depois e volta sozinho se o site não responder.
          if [ "$merged" = 1 ]; then
            gh workflow run ci.yml --repo "$REPO" --ref develop
            gh workflow run deploy-cloudflare.yml --repo "$REPO" --ref develop -f confirm=DEPLOY
          fi
