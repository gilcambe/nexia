<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda Clínica — Consultas e pacientes num só lugar</title>
  <meta name="description" content="Consultas e pacientes num só lugar">
  <meta name="theme-color" content="#4f46e5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>try{if(localStorage.getItem('nexia-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
</head>
<body>
  <a class="skip" href="#conteudo">Pular para o conteúdo</a>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Menu do sistema">
      <div class="sidebar__brand">
        <span class="logo" aria-hidden="true">A</span>
        <span>Agenda Clínica</span>
      </div>
      <nav class="sidebar__nav" aria-label="Seções">
        <a href="#/painel" data-route="painel"><svg class="i" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg><span>Painel</span></a>
        <a href="#/consultas" data-route="consultas"><svg class="i" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>Consultas</span></a>
      </nav>
      <div class="sidebar__foot">
        <p>Suporte: suporte@clinica.com.br</p>
        <p>Dados salvos neste navegador.</p>
      </div>
    </aside>
    <div class="backdrop" data-close-menu hidden></div>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar"><svg class="i" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <div class="topbar__title">
          <h1 id="view-title">Painel</h1>
          <p id="view-sub">Consultas e pacientes num só lugar</p>
        </div>
        <label class="search">
          <span class="sr-only">Buscar</span>
          <svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search" type="search" placeholder="Buscar..." autocomplete="off">
        </label>
        <button class="icon-btn" type="button" id="theme" aria-label="Alternar modo escuro"><svg class="i" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      </header>
      <main id="conteudo" class="content">
        <section id="view-painel" class="view" aria-labelledby="view-title">
          <div class="kpis" id="kpis"></div>
          <div class="grid2">
            <article class="card">
              <header class="card__head"><h2 id="chart-title">Resumo</h2></header>
              <div class="chart-box"><canvas id="chart" aria-label="Gráfico do resumo" role="img"></canvas></div>
            </article>
            <article class="card">
              <header class="card__head"><h2>Últimos cadastros</h2></header>
              <ul class="recent" id="recent"></ul>
            </article>
          </div>
        </section>
        <section id="view-entity" class="view" hidden>
          <div class="toolbar">
            <p class="count" id="count"></p>
            <div class="toolbar__actions">
              <button class="btn btn--ghost" type="button" id="export"><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg> Exportar CSV</button>
              <button class="btn btn--primary" type="button" id="add"><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> <span id="add-label">Novo</span></button>
            </div>
          </div>
          <div class="card table-card">
            <div class="table-wrap">
              <table class="table">
                <thead id="thead"></thead>
                <tbody id="tbody"></tbody>
              </table>
            </div>
            <div class="empty" id="empty" hidden>
              <svg class="i" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/></svg>
              <h2>Nada por aqui ainda</h2>
              <p>Clique em “Adicionar” para fazer o primeiro cadastro.</p>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <dialog class="modal" id="modal" aria-labelledby="modal-title">
    <form id="form" novalidate>
      <header class="modal__head">
        <h2 id="modal-title">Novo</h2>
        <button class="icon-btn" type="button" data-close aria-label="Fechar"><svg class="i" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </header>
      <div class="modal__body" id="form-fields"></div>
      <footer class="modal__foot">
        <button class="btn btn--ghost" type="button" data-close>Cancelar</button>
        <button class="btn btn--primary" type="submit">Salvar</button>
      </footer>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="application/json" id="app-config">{"key":"nexia-app:demos/agenda-clinica","name":"Agenda Clínica","entities":[{"key":"consultas","label":"Consultas","singular":"Consulta","fields":[{"key":"paciente","label":"Paciente","type":"text","options":[],"required":true},{"key":"data","label":"Data","type":"date","options":[],"required":true},{"key":"hora","label":"Hora","type":"text","options":[],"required":true},{"key":"status","label":"Status","type":"select","options":["Agendada","Confirmada","Concluída","Cancelada"],"required":true},{"key":"valor","label":"Valor","type":"money","options":[],"required":true},{"key":"obs","label":"Observações","type":"textarea","options":[],"required":false}],"sample":[{"paciente":"Ana Souza","data":"2026-10-06","hora":"09:00","status":"Confirmada","valor":"250","obs":""},{"paciente":"Bruno Lima","data":"2026-10-06","hora":"10:30","status":"Agendada","valor":"180","obs":""},{"paciente":"Carla Dias","data":"2026-10-07","hora":"14:00","status":"Concluída","valor":"320","obs":""},{"paciente":"Davi Reis","data":"2026-10-08","hora":"16:15","status":"Cancelada","valor":"0","obs":""}]}]}</script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
