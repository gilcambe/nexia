<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kernex Finance</title>
<meta name="theme-color" content="#2f6bff">
<link rel="manifest" href="/prumo/manifest.webmanifest">
<link rel="icon" href="/prumo/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/prumo/icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root { --fundo:#070d1c; --cartao:#0f1a33; --borda:#1c2b4d; --texto:#e8eefc; --fraco:#8ea3cc; --verde:#2f6bff; --verde2:#5b8dff; --ganho:#22c55e; --perda:#ef4444; --aviso:#f59e0b; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--fundo); color:var(--texto); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { min-height:100vh; padding-bottom:env(safe-area-inset-bottom); }
  header { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--borda); position:sticky; top:0; background:var(--fundo); z-index:5; }
  header img { width:32px; height:32px; }
  header h1 { font-size:20px; margin:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header button { background:none; border:1px solid var(--borda); color:var(--fraco); border-radius:10px; padding:8px 12px; font-size:14px; }
  #btn-menu { width:40px; height:40px; display:grid; place-items:center; padding:0; }
  #btn-menu svg { width:24px; height:24px; }
  .card.kf-hero { background:linear-gradient(135deg,#1e3f9e 0%,#0f1a33 70%); }
  main { padding:16px; max-width:720px; margin:0 auto; }
  .btn { display:block; width:100%; min-height:52px; border:0; border-radius:14px; background:var(--verde); color:#fff; font-size:18px; font-weight:600; cursor:pointer; }
  .btn:active { background:var(--verde2); }
  .entrar { text-align:center; padding-top:12vh; }
  .entrar img { width:96px; height:96px; }
  .entrar p { color:var(--fraco); }
  .faixa { margin:12px 16px 0; padding:12px 14px; border-radius:12px; font-size:15px; }
  .faixa.erro { background:#3a1414; border:1px solid var(--perigo); }
  .faixa.aviso { background:#33260c; border:1px solid var(--aviso); }
  .em-breve { text-align:center; color:var(--fraco); padding:48px 16px; }
  nav.abas {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    width: 280px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    transform: translateX(-100%);
    background: var(--cartao);
    border-top: 1px solid var(--borda);
    z-index: 10;
  }
  #fundo-menu { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:9; display:none; }
  #fundo-menu[hidden] { display:none !important; }
  nav.abas.aberto { transform: translateX(0); }
  nav.abas button {
    flex: 0 0 auto;
    min-height: 56px;
    background: none;
    border: 0;
    border-bottom: 1px solid var(--borda);
    color: var(--fraco);
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 10px;
    padding: 0 16px;
    text-align: left;
    cursor: pointer;
  }
  nav.abas svg { width:22px; height:22px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  nav.abas button[aria-selected="true"] { color: var(--verde2); font-weight: 600; }
  button.titulo-grupo {
    margin: 0;
    padding: 14px 16px 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--fraco);
    text-transform: uppercase;
    border-bottom: 1px solid var(--borda);
    background: none;
    border: 0;
    text-align: left;
    width: 100%;
    cursor: pointer;
  }
  button.titulo-grupo[aria-expanded="true"] { color: var(--texto); }
  footer { padding:6px 12px calc(6px + env(safe-area-inset-bottom)); text-align:center; font-size:12px; color:var(--fraco); background:var(--fundo); }
  header .instalar { background:var(--verde); border-color:var(--verde); color:#fff; font-weight:600; }
  .btn.sec { margin-top:12px; background:none; border:1px solid var(--verde); color:var(--verde2); }
  .dica { position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:flex-end; z-index:20; }
  .dica div { background:var(--cartao); border-top:1px solid var(--borda); border-radius:18px 18px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom)); width:100%; }
  .dica h3 { margin:0 0 8px; } .dica ol { margin:0 0 16px; padding-left:20px; color:var(--texto); }
  .valor { transition:filter .15s; } body.privado .valor { filter:blur(7px); user-select:none; }
  [hidden] { display:none !important; }

  @media (max-width: 599px) {
    header h1 { display:none; }
    #titulo-aba { flex:1; font-weight:600; font-size:18px; }
    #instalar .rotulo { display:none; }
  }
  @media (min-width: 1024px) {
    nav.abas {
      transform: none;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: 280px;
      overflow-y: auto;
    }
    #btn-menu { display: none; }
    main {
      max-width: 1100px;
      margin-left: 280px;
    }
    #conteudo {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
  }
</style>
</head>
<body>
<!-- #3556: no endereço antigo, avisa o novo (o antigo continua funcionando para quem instalou) -->
<div id="kf-novo-endereco" hidden style="background:#0f766e;color:#fff;padding:10px 14px;text-align:center;font:14px system-ui,sans-serif">Novo endereço: <a href="https://finance.kernex.com.br/" style="color:#fff;font-weight:700">finance.kernex.com.br</a></div>
<script>try{if(location.hostname!=="finance.kernex.com.br"&&!/^(localhost|127.)/.test(location.hostname))document.getElementById("kf-novo-endereco").hidden=false}catch(e){}</script>
<header>
  <button id="btn-menu" type="button" aria-label="Menu" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7" stroke="currentColor" stroke-width="2"/><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2"/><line x1="4" y1="17" x2="20" y2="17" stroke="currentColor" stroke-width="2"/></svg>
  </button>
  <img src="/prumo/icone.svg" alt="">
  <h1>Kernex Finance</h1>
  <span id="titulo-aba">Início</span>
  <button id="instalar" class="instalar" type="button" hidden>📲<span class="rotulo">Instalar app</span></button>
  <button id="olho" type="button" aria-pressed="false" title="Esconder valores">👁</button>
  <button id="sair" type="button" hidden>Sair</button>
</header>
<div id="erro" class="faixa erro" role="alert" hidden></div>
<div id="aviso" class="faixa aviso" role="status" hidden></div>

<section id="tela-entrar" class="entrar" hidden>
  <main>
    <img src="/prumo/icone.svg" alt="Kernex Finance">
    <h2>Sua vida financeira inteira. Uma inteligência.</h2>
    <p>Documentos, cartões, investimentos, milhas e objetivos num lugar só.</p>
    <button id="entrar" class="btn" type="button" data-testid="prumo-entrar">Entrar com Google</button>
    <button id="instalar2" class="btn sec" type="button" hidden>📲 Baixar o app no celular</button>
  </main>
</section>

<main id="tela-app" hidden>
  <div id="conteudo" aria-live="polite"></div>
</main>

<nav id="abas" class="abas" role="tablist" hidden>
  <button type="button" id="fechar-menu" aria-label="Fechar menu"><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button type="button" class="titulo-grupo" aria-expanded="false" data-grupo="visao">Visão geral</button>
  <div class="grupo" id="grupo-visao" hidden>
  <button type="button" role="tab" data-aba="inicio" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="1"/></svg>Início</button>
  <button type="button" role="tab" data-aba="assistente" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm9-2a6 6 0 0 0-6-6 6 6 0 0 0-6 6 6 6 0 0 0 6 6 6 6 0 0 0 6-6z"/></svg>Assistente</button>
  <button type="button" role="tab" data-aba="consultor" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>Consultor</button>
  </div>
  <button type="button" class="titulo-grupo" aria-expanded="false" data-grupo="dia">Dia a dia</button>
  <div class="grupo" id="grupo-dia" hidden>
  <button type="button" role="tab" data-aba="contas" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v9h4V9zM17 12h4v7h-4zM17 5h4v4h-4zM3 5v4h4V5z"/></svg>Contas</button>
  <button type="button" role="tab" data-aba="cartoes" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="12" x="2" y="6" rx="2" ry="2"/><line x1="4" y1="10" x2="20" y2="10"/><line x1="4" y1="14" x2="20" y2="14"/><line x1="10" y1="18" x2="10" y2="18"/></svg>Cartões</button>
  <button type="button" role="tab" data-aba="gastos" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5v14H5V5l7-3 7 3zM7 10l3-3 3 3M7 16l3 3 3-3"/></svg>Gastos</button>
  <button type="button" role="tab" data-aba="compras" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.8 5M7 13l-2.293 2.293M7 13l2.293 2.293M16 11v7a4 4 0 0 1-4 4H5a4 4 0 0 1-4-4V5a4 4 0 0 1 4-4h11a4 4 0 0 1 4 4v7"/></svg>Compras</button>
  <button type="button" role="tab" data-aba="orcamento" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Salário</button>
  <button type="button" role="tab" data-aba="dividas" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Dívidas</button>
  <button type="button" role="tab" data-aba="economizar" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c6.48 0 12 5.48 12 12s-5.48 12-12 12S0 20.48 0 14 5.48 2 12 2zm0 2a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm7 12h-4v4h4z"/></svg>Economizar</button>
  </div>
  <button type="button" class="titulo-grupo" aria-expanded="false" data-grupo="invest">Investimentos</button>
  <div class="grupo" id="grupo-invest" hidden>
  <button type="button" role="tab" data-aba="investimentos" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Investir</button>
  <button type="button" role="tab" data-aba="carteira" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2z"/><polyline points="15 11 13 9 9 11"/></svg>Carteira</button>
  <button type="button" role="tab" data-aba="pontos" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="10" r="1"/></svg>Milhas</button>
  <button type="button" role="tab" data-aba="mercado" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="3" y1="18" x2="12" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Mercado</button>
  </div>
  <button type="button" class="titulo-grupo" aria-expanded="false" data-grupo="planos">Planos</button>
  <div class="grupo" id="grupo-planos" hidden>
  <button type="button" role="tab" data-aba="metas" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>Metas</button>
  <button type="button" role="tab" data-aba="objetivos" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>Objetivos</button>
  <button type="button" role="tab" data-aba="familia" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Família</button>
  </div>
  <button type="button" class="titulo-grupo" aria-expanded="false" data-grupo="docs">Documentos</button>
  <div class="grupo" id="grupo-docs" hidden>
  <button type="button" role="tab" data-aba="documentos" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Documentos</button>
  <button type="button" role="tab" data-aba="impostos" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Impostos</button>
  </div>
  <button type="button" class="titulo-grupo" aria-expanded="false" data-grupo="ajustes">Ajustes</button>
  <div class="grupo" id="grupo-ajustes" hidden>
  <button type="button" role="tab" data-aba="conexoes" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 3.6V16h-4V3.6C8.579 4.36 7 6.197 7 8.5 7 10.761 8.761 12.5 11 12.5s4-1.739 4-4c0-2.303-1.579-4.14-3.5-4.9M21 12a9 9 0 1 1-9-9 9 9 0 0 1 9 9"/></svg>Bancos</button>
  <button type="button" role="tab" data-aba="alertas" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 17l.5-6L12 7z"/></svg>Alertas</button>
  <button type="button" role="tab" data-aba="ajuda" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-5 2v4h4V4z"/></svg>Ajuda</button>
  </div>
</nav>
<div id="fundo-menu" hidden></div>
<div id="dica" class="dica" role="dialog" aria-modal="true" hidden><div>
  <h3>Instalar o Kernex Finance</h3>
  <ol id="dica-passos"></ol>
  <button id="dica-ok" class="btn" type="button">Entendi</button>
</div></div>
<footer>Seus dados são só seus. O app nunca pede senha de banco.</footer>

</body>
</html>
