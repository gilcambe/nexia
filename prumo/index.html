<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prumo</title>
<meta name="theme-color" content="#16a34a">
<link rel="manifest" href="/prumo/manifest.webmanifest">
<link rel="icon" href="/prumo/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/prumo/icone.svg">
<style>
  :root { --fundo:#0b1210; --cartao:#14201c; --borda:#22332d; --texto:#e8f1ed; --fraco:#9db3aa; --verde:#16a34a; --verde2:#22c55e; --perigo:#ef4444; --aviso:#f59e0b; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--fundo); color:var(--texto); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { min-height:100vh; padding-bottom:calc(120px + env(safe-area-inset-bottom)); }
  header { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--borda); position:sticky; top:0; background:var(--fundo); z-index:5; }
  header img { width:32px; height:32px; }
  header h1 { font-size:20px; margin:0; flex:1; }
  header button { background:none; border:1px solid var(--borda); color:var(--fraco); border-radius:10px; padding:8px 12px; font-size:14px; }
  main { padding:16px; max-width:720px; margin:0 auto; }
  .btn { display:block; width:100%; min-height:52px; border:0; border-radius:14px; background:var(--verde); color:#fff; font-size:18px; font-weight:600; cursor:pointer; }
  .btn:active { background:var(--verde2); }
  .entrar { text-align:center; padding-top:12vh; }
  .entrar img { width:96px; height:96px; }
  .entrar p { color:var(--fraco); }
  .faixa { margin:12px 16px 0; padding:12px 14px; border-radius:12px; font-size:15px; }
  .faixa.erro { background:#3a1414; border:1px solid var(--perigo); }
  .faixa.aviso { background:#33260c; border:1px solid var(--aviso); }
  .em-breve { text-align:center; color:var(--fraco); padding:48px 16px; }
  nav.abas { position:fixed; left:0; right:0; bottom:calc(28px + env(safe-area-inset-bottom)); display:flex; background:var(--cartao); border-top:1px solid var(--borda); z-index:5; }
  nav.abas button { flex:1; min-height:60px; background:none; border:0; color:var(--fraco); font-size:13px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  nav.abas button span { font-size:22px; }
  nav.abas button[aria-selected="true"] { color:var(--verde2); font-weight:600; }
  footer { position:fixed; left:0; right:0; bottom:0; padding:6px 12px calc(6px + env(safe-area-inset-bottom)); text-align:center; font-size:12px; color:var(--fraco); background:var(--fundo); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <img src="/prumo/icone.svg" alt="">
  <h1>Prumo</h1>
  <button id="sair" type="button" hidden>Sair</button>
</header>
<div id="erro" class="faixa erro" role="alert" hidden></div>
<div id="aviso" class="faixa aviso" role="status" hidden></div>

<section id="tela-entrar" class="entrar" hidden>
  <main>
    <img src="/prumo/icone.svg" alt="Prumo">
    <h2>Suas finanças no prumo</h2>
    <p>Investimentos, cartões e lista de compras num lugar só.</p>
    <button id="entrar" class="btn" type="button" data-testid="prumo-entrar">Entrar com Google</button>
  </main>
</section>

<main id="tela-app" hidden>
  <div id="conteudo" aria-live="polite"></div>
</main>

<nav id="abas" class="abas" role="tablist" hidden>
  <button type="button" role="tab" data-aba="carteira" aria-selected="true"><span>💼</span>Carteira</button>
  <button type="button" role="tab" data-aba="gastos" aria-selected="false"><span>💳</span>Gastos</button>
  <button type="button" role="tab" data-aba="compras" aria-selected="false"><span>🛒</span>Compras</button>
  <button type="button" role="tab" data-aba="objetivos" aria-selected="false"><span>🎯</span>Objetivos</button>
</nav>
<footer>Seus dados são só seus. O app nunca pede senha de banco.</footer>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="/prumo/app.js"></script>
</body>
</html>
