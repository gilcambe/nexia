<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kernex Finance</title>
<meta name="theme-color" content="#2f6bff">
<link rel="manifest" href="/prumo/manifest.webmanifest">
<link rel="icon" href="/prumo/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/prumo/icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root { --fundo:#070d1c; --cartao:#0f1a33; --borda:#1c2b4d; --texto:#e8eefc; --fraco:#8ea3cc; --verde:#2f6bff; --verde2:#5b8dff; --perigo:#ef4444; --aviso:#f59e0b; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--fundo); color:var(--texto); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { min-height:100vh; padding-bottom:calc(120px + env(safe-area-inset-bottom)); }
  header { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--borda); position:sticky; top:0; background:var(--fundo); z-index:5; }
  header img { width:32px; height:32px; }
  header h1 { font-size:20px; margin:0; flex:1; }
  header button { background:none; border:1px solid var(--borda); color:var(--fraco); border-radius:10px; padding:8px 12px; font-size:14px; }
  main { padding:16px; max-width:720px; margin:0 auto; }
  .btn { display:block; width:100%; min-height:52px; border:0; border-radius:14px; background:var(--verde); color:#fff; font-size:18px; font-weight:600; cursor:pointer; }
  .btn:active { background:var(--verde2); }
  .entrar { text-align:center; padding-top:12vh; }
  .entrar img { width:96px; height:96px; }
  .entrar p { color:var(--fraco); }
  .faixa { margin:12px 16px 0; padding:12px 14px; border-radius:12px; font-size:15px; }
  .faixa.erro { background:#3a1414; border:1px solid var(--perigo); }
  .faixa.aviso { background:#33260c; border:1px solid var(--aviso); }
  .em-breve { text-align:center; color:var(--fraco); padding:48px 16px; }
  nav.abas { overflow-x:auto; position:fixed; left:0; right:0; bottom:calc(28px + env(safe-area-inset-bottom)); display:flex; background:var(--cartao); border-top:1px solid var(--borda); z-index:5; }
  nav.abas button { flex:1 0 64px; min-width:64px; min-height:60px; background:none; border:0; color:var(--fraco); font-size:11px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  nav.abas button span { font-size:22px; }
  nav.abas button[aria-selected="true"] { color:var(--verde2); font-weight:600; }
  footer { position:fixed; left:0; right:0; bottom:0; padding:6px 12px calc(6px + env(safe-area-inset-bottom)); text-align:center; font-size:12px; color:var(--fraco); background:var(--fundo); }
  header .instalar { background:var(--verde); border-color:var(--verde); color:#fff; font-weight:600; }
  .btn.sec { margin-top:12px; background:none; border:1px solid var(--verde); color:var(--verde2); }
  .dica { position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:flex-end; z-index:20; }
  .dica div { background:var(--cartao); border-top:1px solid var(--borda); border-radius:18px 18px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom)); width:100%; }
  .dica h3 { margin:0 0 8px; } .dica ol { margin:0 0 16px; padding-left:20px; color:var(--texto); }
  .valor { transition:filter .15s; } body.privado .valor { filter:blur(7px); user-select:none; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <img src="/prumo/icone.svg" alt="">
  <h1>Kernex Finance</h1>
  <button id="instalar" class="instalar" type="button" hidden>📲 Instalar app</button>
  <button id="olho" type="button" aria-pressed="false" title="Esconder valores">👁</button>
  <button id="sair" type="button" hidden>Sair</button>
</header>
<div id="erro" class="faixa erro" role="alert" hidden></div>
<div id="aviso" class="faixa aviso" role="status" hidden></div>

<section id="tela-entrar" class="entrar" hidden>
  <main>
    <img src="/prumo/icone.svg" alt="Kernex Finance">
    <h2>Sua vida financeira inteira. Uma inteligência.</h2>
    <p>Documentos, cartões, investimentos, milhas e objetivos num lugar só.</p>
    <button id="entrar" class="btn" type="button" data-testid="prumo-entrar">Entrar com Google</button>
    <button id="instalar2" class="btn sec" type="button" hidden>📲 Baixar o app no celular</button>
  </main>
</section>

<main id="tela-app" hidden>
  <div id="conteudo" aria-live="polite"></div>
</main>

<nav id="abas" class="abas" role="tablist" hidden>
  <button type="button" role="tab" data-aba="inicio" aria-selected="true"><span>🏠</span>Início</button>
  <button type="button" role="tab" data-aba="documentos" aria-selected="false"><span>📄</span>Documentos</button>
  <button type="button" role="tab" data-aba="dividas" aria-selected="false"><span>💸</span>Dívidas</button>
  <button type="button" role="tab" data-aba="investimentos" aria-selected="false"><span>📈</span>Investir</button>
  <button type="button" role="tab" data-aba="economizar" aria-selected="false"><span>💡</span>Economizar</button>
  <button type="button" role="tab" data-aba="metas" aria-selected="false"><span>🏁</span>Metas</button>
  <button type="button" role="tab" data-aba="familia" aria-selected="false"><span>👨‍👩‍👧</span>Família</button>
  <button type="button" role="tab" data-aba="impostos" aria-selected="false"><span>🗂️</span>Impostos</button>
  <button type="button" role="tab" data-aba="alertas" aria-selected="false"><span>🔔</span>Alertas</button>
  <button type="button" role="tab" data-aba="assistente" aria-selected="false"><span>🤖</span>IA</button>
  <button type="button" role="tab" data-aba="contas" aria-selected="false"><span>🏦</span>Contas</button>
  <button type="button" role="tab" data-aba="cartoes" aria-selected="false"><span>🪪</span>Cartões</button>
  <button type="button" role="tab" data-aba="carteira" aria-selected="false"><span>💼</span>Carteira</button>
  <button type="button" role="tab" data-aba="gastos" aria-selected="false"><span>💳</span>Gastos</button>
  <button type="button" role="tab" data-aba="compras" aria-selected="false"><span>🛒</span>Compras</button>
  <button type="button" role="tab" data-aba="objetivos" aria-selected="false"><span>🎯</span>Objetivos</button>
  <button type="button" role="tab" data-aba="orcamento" aria-selected="false"><span>📅</span>Salário</button>
  <button type="button" role="tab" data-aba="consultor" aria-selected="false"><span>🧭</span>Consultor</button>
  <button type="button" role="tab" data-aba="pontos" aria-selected="false"><span>✈️</span>Milhas</button>
</nav>
<div id="dica" class="dica" role="dialog" aria-modal="true" hidden><div>
  <h3>Instalar o Kernex Finance</h3>
  <ol id="dica-passos"></ol>
  <button id="dica-ok" class="btn" type="button">Entendi</button>
</div></div>
<footer>Seus dados são só seus. O app nunca pede senha de banco.</footer>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="/prumo/app.js"></script>
<script src="/prumo/instalar.js"></script>
<script src="/prumo/privacidade.js"></script>
</body>
</html>
