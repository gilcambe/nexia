<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Destinos - Viajante Pro</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
  <script src="/clientes/viajantepro.js" defer></script>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold mb-6">Editar Destinos</h1>

    <!-- Verificação de Login -->
    <div id="login-check" class="mb-6">
      <p class="text-gray-600">Verificando login...</p>
    </div>

    <!-- Lista de Destinos -->
    <div id="destinos-container" class="hidden">
      <button id="adicionar-destino" class="mb-4 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">Adicionar Destino</button>
      <div id="destinos-lista" class="space-y-4"></div>
      <button id="salvar-destinos" class="mt-6 px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">Salvar</button>
      <p id="mensagem-salvo" class="mt-4 text-green-600 hidden">Destinos salvos com sucesso!</p>
    </div>
  </div>

  <script>
    let destinos = [];
    let proximoIdTemporario = 1;

    // Verificação de Login
    function verificarLogin() {
      const usuario = obterUsuario();
      if (!usuario) {
        document.getElementById('login-check').innerHTML = '<p class="text-red-600">Acesso negado. Faça login para continuar.</p>';
        return false;
      }
      document.getElementById('login-check').classList.add('hidden');
      document.getElementById('destinos-container').classList.remove('hidden');
      return true;
    }

    // Carregar Destinos
    function lerConteudo() {
      const conteudoSalvo = obterConteudo();
      if (conteudoSalvo && conteudoSalvo.destinos) {
        destinos = conteudoSalvo.destinos;
      } else {
        destinos = [];
      }
      renderizarDestinos();
    }

    // Renderizar Destinos
    function renderizarDestinos() {
      const lista = document.getElementById('destinos-lista');
      lista.innerHTML = '';
      destinos.forEach((destino, index) => {
        const card = document.createElement('div');
        card.className = 'p-4 border rounded-lg bg-gray-50';
        card.innerHTML = `
          <input type="text" placeholder="Título" class="w-full p-2 mb-2 border rounded" value="${destino.titulo || ''}">
          <select class="w-full p-2 mb-2 border rounded">
            <option value="praia" ${destino.categoria === 'praia' ? 'selected' : ''}>Praia</option>
            <option value="montanha" ${destino.categoria === 'montanha' ? 'selected' : ''}>Montanha</option>
            <option value="cidade" ${destino.categoria === 'cidade' ? 'selected' : ''}>Cidade</option>
          </select>
          <input type="number" placeholder="Preço" class="w-full p-2 mb-2 border rounded" value="${destino.preco || ''}">
          <input type="file" accept="image/*" class="w-full p-2 mb-2 border rounded">
          <input type="text" placeholder="URL do Vídeo" class="w-full p-2 mb-2 border rounded" value="${destino.video || ''}">
          <button class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600" onclick="removerDestino(${index})">Remover</button>
        `;
        lista.appendChild(card);
      });
    }

    // Adicionar Destino
    function adicionarDestino() {
      const novoDestino = {
        id: `temp-${proximoIdTemporario++}`,
        titulo: '',
        categoria: 'praia',
        preco: 0,
        foto: null,
        video: ''
      };
      destinos.push(novoDestino);
      renderizarDestinos();
    }

    // Remover Destino
    function removerDestino(index) {
      destinos.splice(index, 1);
      renderizarDestinos();
    }

    // Salvar Destinos
    function salvarDestinos() {
      const destinosFormatados = destinos.map(destino => ({
        titulo: destino.titulo,
        categoria: destino.categoria,
        preco: destino.preco,
        foto: destino.foto,
        video: destino.video
      }));
      salvarConteudo({ destinos: destinosFormatados });
      document.getElementById('mensagem-salvo').classList.remove('hidden');
      setTimeout(() => document.getElementById('mensagem-salvo').classList.add('hidden'), 3000);
    }

    // Inicialização
    if (verificarLogin()) {
      lerConteudo();
      document.getElementById('adicionar-destino').addEventListener('click', adicionarDestino);
      document.getElementById('salvar-destinos').addEventListener('click', salvarDestinos);
    }
  </script>
</body>
</html>
