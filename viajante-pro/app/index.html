<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Viajante Pro — App do Viajante</title>
  <link rel="manifest" href="/viajante-pro/app/manifest.webmanifest">
  <meta name="theme-color" content="#0B132B">
  <link rel="icon" type="image/png" href="/viajante-pro/app/icone-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#0B132B',
              card: '#1C2541',
              accent: '#00E5FF',
              alert: '#FF3B30',
              text: '#F8F9FA',
              muted: '#8D99AE'
            }
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body { background-color: #0B132B; color: #F8F9FA; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 480px; margin: 0 auto; overflow-x: hidden; }
    .nav-btn.active { color: #00E5FF; border-bottom: 2px solid #00E5FF; font-weight: 600; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-brand-dark min-h-screen flex flex-col justify-between select-none">

  <!-- Header -->
  <header class="bg-brand-card/90 backdrop-blur sticky top-0 z-30 px-4 py-3 border-b border-white/10 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-bold text-white text-sm shadow">VP</div>
      <div>
        <h1 class="font-bold text-sm leading-none text-white">Viajante Pro</h1>
        <span id="carimbo-atualizacao" class="text-[10px] text-brand-muted">Carregando dados...</span>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <button id="btn-instalar" class="hidden bg-brand-accent/20 text-brand-accent text-xs px-2.5 py-1 rounded-full font-medium border border-brand-accent/30">Instalar</button>
      <span id="badge-status-rede" class="w-2.5 h-2.5 rounded-full bg-emerald-500" title="Online"></span>
    </div>
  </header>

  <!-- Sub-Barra de Navegação por Abas (Horizontal Scrollable) -->
  <nav class="bg-brand-card/50 border-b border-white/5 overflow-x-auto no-scrollbar sticky top-[53px] z-20">
    <div class="flex whitespace-nowrap px-2 py-1 space-x-1 text-xs">
      <button onclick="navegarAba('hoje')" id="tab-hoje" class="nav-btn active px-3 py-2 text-brand-muted hover:text-white transition-colors">Hoje</button>
      <button onclick="navegarAba('voos')" id="tab-voos" class="nav-btn px-3 py-2 text-brand-muted hover:text-white transition-colors">Voos</button>
      <button onclick="navegarAba('roteiro')" id="tab-roteiro" class="nav-btn px-3 py-2 text-brand-muted hover:text-white transition-colors">Roteiro</button>
      <button onclick="navegarAba('hotel-carro')" id="tab-hotel-carro" class="nav-btn px-3 py-2 text-brand-muted hover:text-white transition-colors">Hotel & Carro</button>
      <button onclick="navegarAba('documentos')" id="tab-documentos" class="nav-btn px-3 py-2 text-brand-muted hover:text-white transition-colors">Documentos</button>
      <button onclick="navegarAba('motorista')" id="tab-motorista" class="nav-btn px-3 py-2 text-brand-muted hover:text-white transition-colors">Mostre ao Motorista</button>
      <button onclick="navegarAba('emergencia')" id="tab-emergencia" class="nav-btn px-3 py-2 text-brand-muted hover:text-white transition-colors">Emergência</button>
      <button onclick="navegarAba('conversa')" id="tab-conversa" class="nav-btn px-3 py-2 text-brand-muted hover:text-white transition-colors">Conversa</button>
    </div>
  </nav>

  <!-- Conteúdo Principal -->
  <main id="app-conteudo" class="flex-1 p-4 pb-20">
    <!-- Renderizado via app.js -->
  </main>

  <!-- Botão Flutuante de Conversa/Suporte -->
  <div class="fixed bottom-4 right-4 z-40">
    <button id="btn-conversa" class="w-12 h-12 rounded-full bg-brand-accent text-brand-dark flex items-center justify-center shadow-lg shadow-cyan-500/20 hover:scale-105 active:scale-95 transition-transform font-bold text-xl">
      💬
    </button>
  </div>

  <script src="/viajante-pro/app/app.js"></script>
  <script src="/viajante-pro/abertura-kernex.js?v=3" data-produto="VIAJANTE PRO" defer></script>
  <script src="/viajante-pro/vp-marca.js?v=3" defer></script>
  <script src="/clientes/viajantepro.js" defer></script>
  <script>
    // Adicionar funcionalidade para ler o código da viagem e carregar os dados
    document.addEventListener('DOMContentLoaded', function() {
      const params = new URLSearchParams(window.location.search);
      const codigoViagem = params.get('v');

      if (codigoViagem) {
        // Carregar dados da viagem usando obterViagemPublica
        window.viajantePro = window.viajantePro || {};
        window.viajantePro.obterViagemPublica(codigoViagem)
        .then(data => {
          // Armazenar os dados da viagem
          window.viagemAtual = data;

          // Atualizar a interface com os dados da viagem
          atualizarInterfaceViagem(data);

          // Configurar a aba de conversa
          configurarAbaConversa(codigoViagem);
        })
        .catch(error => {
          console.error('Erro ao carregar viagem:', error.message || error);
        });
      }

      // Função para atualizar a interface com os dados da viagem
      function atualizarInterfaceViagem(viagem) {
        // Atualizar o título da página
        document.title = `Viajante Pro — ${viagem.nome}`;

        // Atualizar o conteúdo das abas
        const hojeContent = document.getElementById('hoje-content') || document.createElement('div');
        hojeContent.id = 'hoje-content';
        hojeContent.innerHTML = `
          <h2 class="text-lg font-bold mb-2">${viagem.nome}</h2>
          <p class="text-brand-muted mb-4">${viagem.destino}</p>
          <p class="text-sm mb-2">Datas: ${viagem.datas.inicio} até ${viagem.datas.fim}</p>
          <div class="space-y-2">
            ${viagem.passageiros.map(p => `
              <div class="flex items-center space-x-2">
                <span class="w-2 h-2 rounded-full bg-brand-accent"></span>
                <span>${p.nome} (${p.tipo})</span>
              </div>
            `).join('')}
          </div>
        `;

        const roteiroContent = document.getElementById('roteiro-content') || document.createElement('div');
        roteiroContent.id = 'roteiro-content';
        roteiroContent.innerHTML = `
          <h2 class="text-lg font-bold mb-4">Roteiro</h2>
          <div class="space-y-4">
            ${viagem.roteiro.map(r => `
              <div class="bg-brand-card/50 p-3 rounded-lg">
                <h3 class="font-medium">Dia ${r.dia}</h3>
                <p class="text-sm text-brand-muted mt-1">${r.descricao}</p>
              </div>
            `).join('')}
          </div>
        `;

        // Adicionar conteúdo ao DOM
        const appConteudo = document.getElementById('app-conteudo');
        appConteudo.innerHTML = '';
        appConteudo.appendChild(hojeContent);
        appConteudo.appendChild(roteiroContent);

        // Atualizar o carimbo de atualização
        const carimbo = document.getElementById('carimbo-atualizacao');
        carimbo.textContent = `Atualizado em ${new Date().toLocaleString()}`;
      }

      // Função para configurar a aba de conversa
      function escHtml(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

      function configurarAbaConversa(viagemId) {
        let ultimaMensagemId = null;
        let intervaloChat = null;

        // Função para carregar mensagens
        function carregarMensagens() {
          window.viajantePro.listarChat(viagemId)
          .then(data => {
            const conversaContent = document.getElementById('conversa-content') || document.createElement('div');
            conversaContent.id = 'conversa-content';

            if (!document.getElementById('conversa-content')) {
              conversaContent.innerHTML = `
                <h2 class="text-lg font-bold mb-4">Conversa</h2>
                <div id="mensagens-container" class="space-y-3 mb-4 max-h-96 overflow-y-auto"></div>
                <div class="flex space-x-2">
                  <input type="text" id="input-mensagem" class="flex-1 bg-brand-card/50 border border-brand-card/30 rounded-lg px-3 py-2 text-sm" placeholder="Digite sua mensagem...">
                  <button id="btn-enviar-mensagem" class="bg-brand-accent text-brand-dark px-4 py-2 rounded-lg font-medium">Enviar</button>
                </div>
              `;
              document.getElementById('app-conteudo').appendChild(conversaContent);

              // Configurar evento de envio de mensagem
              document.getElementById('btn-enviar-mensagem').addEventListener('click', enviarMensagem);
              document.getElementById('input-mensagem').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') enviarMensagem();
              });
            }

            const mensagensContainer = document.getElementById('mensagens-container');
            data.forEach(msg => {
              const msgElement = document.createElement('div');
              msgElement.className = `p-3 rounded-lg ${msg.autor === 'viajante' ? 'bg-brand-card/50 ml-auto max-w-[80%]' : 'bg-brand-accent/20 mr-auto max-w-[80%]'}`;
              msgElement.innerHTML = `
                <p class="text-sm ${msg.autor === 'viajante' ? 'text-white' : 'text-brand-dark'}">${escHtml(msg.texto)}</p>
                <p class="text-[10px] text-brand-muted mt-1 text-right">${new Date(msg.criado_em).toLocaleString()}</p>
              `;
              mensagensContainer.appendChild(msgElement);
              ultimaMensagemId = msg.id;
            });

            // Rolar para a última mensagem
            mensagensContainer.scrollTop = mensagensContainer.scrollHeight;
          })
          .catch(error => {
            console.error('Erro ao carregar mensagens:', error.message || error);
          });
        }

        // Função para enviar mensagem
        function enviarMensagem() {
          const input = document.getElementById('input-mensagem');
          const texto = input.value.trim();

          if (texto) {
            window.viajantePro.enviarChat({
              codigo: viagemId,
              texto: texto
            })
            .then(() => {
              input.value = '';
              carregarMensagens();
            })
            .catch(error => {
              console.error('Erro ao enviar mensagem:', error.message || error);
            });
          }
        }

        // Configurar intervalo para atualizar mensagens
        intervaloChat = setInterval(carregarMensagens, 10000);

        // Carregar mensagens imediatamente
        carregarMensagens();

        // Limpar intervalo quando a aba for fechada
        document.getElementById('tab-conversa').addEventListener('click', function() {
          if (intervaloChat) {
            clearInterval(intervaloChat);
            intervaloChat = setInterval(carregarMensagens, 10000);
          }
        });
      }

      // Função para navegar entre abas
      window.navegarAba = function(aba) {
        // Remover classe active de todas as abas
        document.querySelectorAll('.nav-btn').forEach(btn => {
          btn.classList.remove('active');
        });

        // Adicionar classe active à aba selecionada
        document.getElementById(`tab-${aba}`).classList.add('active');

        // Mostrar conteúdo da aba selecionada
        document.querySelectorAll('#app-conteudo > div').forEach(content => {
          content.style.display = 'none';
        });

        document.getElementById(`${aba}-content`).style.display = 'block';
      };
    });
  </script>
</body>
</html>
