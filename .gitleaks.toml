# Varredura de segredos (SEC Fase 1). Usa as regras padrão do gitleaks + regras locais.
title = "Gitleaks Config"

[extend]
useDefault = true

[[rules]]
id = "mercadopago-access-token"
description = "Mercado Pago access token / public key"
regex = '''\b(?:APP_USR|TEST)-[0-9a-f]{4,}-[0-9a-f-]{8,}\b'''
keywords = ["app_usr", "test-"]

[[rules]]
id = "firebase-service-account"
description = "Firebase/GCP service account JSON"
regex = '''"type"\s*:\s*"service_account"'''
keywords = ["service_account"]

[[rules]]
id = "service-account-base64"
description = "Service account JSON em base64"
regex = '''ewogICJ0eXBlIjogInNlcnZpY2VfYWNjb3VudC|eyJ0eXBlIjoic2VydmljZV9hY2NvdW50'''
keywords = ["ewogicj0exbljogInnlcnzpy2vfywnjb3vudc", "eyj0exblijoic2vydmljzv9hy2nvdw50"]

[[rules]]
id = "dotenv-file"
description = "Arquivo .env versionado"
path = '''(^|/)\.env(\.[^/]*)?$'''
[[rules.allowlists]]
paths = ['''(^|/)\.env\.example$''']

# Regra padrão de chave GCP (detectada em qualquer arquivo).
[[rules]]
id = "gcp-api-key"

# Regra genérica de chave de API (detectada em qualquer arquivo).
[[rules]]
id = "generic-api-key"

# Regra para detectar chaves de API do Instagram.
[[rules]]
id = "instagram-api-key"
description = "Chave de API do Instagram (IG_API_KEY)"
regex = '''(?i)(ig_api_key|instagram[_-]?api[_-]?key)[\s"':=<]+[A-Za-z0-9_-]{10,}'''
keywords = ["ig_api_key", "instagram"]

# Valores fictícios usados pelos testes (emulador e tokens inválidos de propósito).
[allowlist]
description = "Falsos positivos conhecidos"
paths = [
  '''(^|/)package-lock\.json$''',
  '''^\.gitleaks\.toml$''',
  '''\.example\.env$''',
  '''^docs/''',
]
regexes = [
  '''fake-api-key''',
  '''senha-forte-123''',
  '''eyJhbGciOiJub25lIn0\\.e30\\.''',
  '''NEXIA_CRON_SECRET''',
  '''NEXIA_JOBS_TOKEN''',
  '''NEXIA_GITHUB_TOKEN''',
  '''FIREBASE_SERVICE_ACCOUNT_BASE64''',
  '''FIREBASE_SERVICE_ACCOUNT_B''',
  '''FIREBASE_SERVICE_ACCOUNT_C''',
  '''NEXIA_D1_TOKEN''',
  '''NEXIA_D1_ACCOUNT_ID''',
]