<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha viagem — Viajante Pro</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1620">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topo">
  <div class="marca"><span class="logo">VP</span><div><strong id="agencia-nome">Viajante Pro</strong><small id="viagem-titulo">Sua viagem</small></div></div>
  <button id="btn-instalar" class="btn-mini oculto" type="button">Instalar</button>
</header>
<div id="faixa-offline" class="faixa oculto" role="status"></div>
<div id="faixa-alerta" class="alerta oculto" role="alert"></div>

<main id="conteudo">
  <section id="carregando" class="tela ativa"><p class="vazio">Carregando sua viagem…</p></section>
  <section id="erro" class="tela"><div class="cartao"><h2>Não consegui abrir a viagem</h2><p id="erro-texto"></p><p>Peça para a agência mandar o link de novo.</p></div></section>

  <section id="tela-hoje" class="tela" data-aba="hoje"></section>
  <section id="tela-voos" class="tela" data-aba="voos"></section>
  <section id="tela-roteiro" class="tela" data-aba="roteiro"></section>
  <section id="tela-estadia" class="tela" data-aba="estadia"></section>
  <section id="tela-docs" class="tela" data-aba="docs"></section>
  <section id="tela-conversa" class="tela" data-aba="conversa">
    <div id="msgs" class="msgs" aria-live="polite"></div>
    <div id="sem-net-opcoes" class="cartao aviso oculto">
      <p><strong>Sem internet há mais de 1 minuto.</strong> Suas mensagens ficam guardadas e vão sozinhas quando a rede voltar. Se for urgente:</p>
      <div class="linha-btns"><a id="btn-sms" class="btn" href="#">Mandar por SMS</a><a id="btn-whats" class="btn verde" href="#" target="_blank" rel="noopener">WhatsApp</a></div>
    </div>
    <form id="form-msg" class="form-msg" autocomplete="off">
      <input id="msg-texto" maxlength="2000" placeholder="Escreva para a agência…" aria-label="Mensagem">
      <button class="btn" type="submit">Enviar</button>
    </form>
  </section>
  <section id="tela-sos" class="tela" data-aba="sos"></section>
  <section id="tela-motorista" class="tela" data-aba="motorista"></section>
</main>

<nav id="menu" class="menu oculto" aria-label="Menu">
  <button data-ir="hoje" class="ativo">🏠<span>Hoje</span></button>
  <button data-ir="voos">✈️<span>Voos</span></button>
  <button data-ir="roteiro">🗺️<span>Roteiro</span></button>
  <button data-ir="estadia">🏨<span>Hotel</span></button>
  <button data-ir="docs">📄<span>Docs</span></button>
  <button data-ir="conversa">💬<span>Conversa</span><b id="badge" class="badge oculto"></b></button>
  <button data-ir="sos" class="sos">🆘<span>SOS</span></button>
</nav>
<script src="nucleo.js"></script>
<script src="app.js"></script>
</body>
</html>
