<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viajante Pro — Painel da Agência</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1a365d">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css">
  <style>
    :root {
      --bg: #0a192f;
      --cartao: #112240;
      --linha: rgba(56,182,255,0.15);
      --texto: #e6f1ff;
      --suave: rgba(230,241,255,0.7);
      --foco: #38b6ff;
      --erro: #ff6b6b;
      --erro-f: rgba(255,107,107,0.15);
      --ok: #4ec581;
      --ok-f: rgba(78,197,129,0.2);
      --alerta: #e6a23c;
      --alerta-f: rgba(230,162,60,0.15);
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--texto);
      line-height: 1.5;
      padding-bottom: 80px;
      min-height: 100vh;
    }
    .header-painel {
      background: var(--cartao);
      border-bottom: 1px solid var(--linha);
      padding: 16px clamp(16px, 4vw, 32px);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo-tit {
      font-size: 18px;
      font-weight: 700;
      color: var(--foco);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cont-main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }
    .oculto {
      display: none !important;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      border: 0;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn.largo {
      width: 100%;
      margin-top: 16px;
    }
    .btn.azul {
      background: var(--foco);
      color: #0a192f;
    }
    .btn.azul:hover {
      opacity: 0.9;
    }
    .btn.claro {
      background: rgba(255,255,255,0.08);
      color: var(--texto);
    }
    .btn.pequeno {
      min-height: 40px;
      padding: 0 14px;
      font-size: 14px;
    }
    .card {
      background: var(--cartao);
      border: 1px solid var(--linha);
      border-radius: 16px;
      padding: 20px;
      margin-top: 16px;
    }
    .nav-abas {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      background: var(--cartao);
      border-top: 1px solid var(--linha);
      display: flex;
      justify-content: space-around;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    }
    .nav-aba-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: transparent;
      border: 0;
      color: var(--suave);
      font-size: 11px;
      padding: 6px 0;
      position: relative;
      min-height: 44px;
    }
    .nav-aba-btn.ativa {
      color: var(--foco);
      font-weight: 700;
    }
    .nav-aba-btn i {
      font-size: 20px;
    }
    /* Adicione mais estilos conforme necessário */
  </style>
</head>
<body>
  <header class="header-painel">
    <div class="logo-tit">
      <i class="ri-compass-3-line"></i>
      <span>Viajante Pro</span>
    </div>
    <div id="usuario-topo" class="oculto">
      <button class="btn pequeno claro" onclick="abrirModalConta()"><i class="ri-user-settings-line"></i> Conta</button>
    </div>
  </header>

  <div id="area-deslogada" class="cont-main">
    <!-- Tela de login -->
    <div class="card">
      <h2>Login da Agência</h2>
      <form onsubmit="executarLogin(event)">
        <label>E-mail</label>
        <input type="email" id="input-email" required autofocus>
        <label>Senha</label>
        <input type="password" id="input-senha" required>
        <button type="submit" class="btn largo azul">Entrar</button>
      </form>
    </div>
  </div>

  <div id="area-logada" class="cont-main oculto">
    <!-- Conteúdo das abas aqui -->
    <section id="aba-inicio">
      <!-- Conteúdo da aba Início -->
    </section>
    <!-- Adicione as outras abas conforme necessário -->
  </div>

  <nav id="menu-inferior" class="nav-abas oculto">
    <!-- Botões das abas aqui -->
    <button class="nav-aba-btn ativa" onclick="navegarAba('inicio')"><i class="ri-home-5-line"></i><span>Início</span></button>
    <!-- Adicione os outros botões conforme necessário -->
  </nav>

  <script src="painel.js"></script>
  <script>
    // Inicialização e funções do painel
    init();
  </script>
</body>
</html>
