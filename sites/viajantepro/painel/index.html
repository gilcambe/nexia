<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel — Viajante Pro</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1620">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../app/icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="../app/app.css">
<link rel="stylesheet" href="painel.css">
</head>
<body>
<header class="topo">
  <div class="marca"><span class="logo">VP</span><div><strong>Viajante Pro</strong><small>Painel da agência</small></div></div>
  <button id="btn-sair" class="btn-mini oculto" type="button">Sair</button>
</header>

<main id="conteudo" class="largo">
  <section id="tela-login" class="tela ativa">
    <form id="form-login" class="cartao estreito">
      <h2>Entrar no painel</h2>
      <label>Senha<input id="login-senha" type="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit">Entrar</button>
      <p id="login-erro" class="erro"></p>
    </form>
  </section>
  <section id="tela-inicio" class="tela" data-aba="inicio"></section>
  <section id="tela-leads" class="tela" data-aba="leads"></section>
  <section id="tela-clientes" class="tela" data-aba="clientes"></section>
  <section id="tela-viagens" class="tela" data-aba="viagens"></section>
  <section id="tela-conversas" class="tela" data-aba="conversas"></section>
  <section id="tela-appcliente" class="tela" data-aba="appcliente"></section>
  <section id="tela-site" class="tela" data-aba="site"></section>
  <section id="tela-conta" class="tela" data-aba="conta"></section>
</main>

<nav id="menu" class="menu menu-painel oculto" aria-label="Menu">
  <button data-ir="inicio" class="ativo">🏠<span>Início</span></button>
  <button data-ir="leads">📥<span>Leads</span></button>
  <button data-ir="clientes">👥<span>Clientes</span></button>
  <button data-ir="viagens">🧳<span>Viagens</span></button>
  <button data-ir="conversas">💬<span>Conversas</span><b id="badge" class="badge oculto"></b></button>
  <button data-ir="appcliente">📱<span>App</span></button>
  <button data-ir="site">🌐<span>Site</span></button>
  <button data-ir="conta">⚙️<span>Conta</span></button>
</nav>
<div id="aviso" class="toast oculto" role="status"></div>
<script src="nucleo.js"></script>
<script src="painel.js"></script>
</body>
</html>
